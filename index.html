<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>自由品勢音樂剪輯器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f14;
  --panel:#171a21;
  --panel2:#20242d;
  --line:#343945;
  --text:#fff;
  --sub:#9ca3b2;
  --pink:#ff356b;
  --music:#078b98;
  --splice:#7355d8;
  --effect:#c67a16;
  --beat:#ffd447;
  --danger:#ff3b45;
  --ruler-h:38px;
  --track-h:70px;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}

/* ===== 最上方：固定一排 5 顆 ===== */
.app-top{
  position:sticky;top:0;z-index:120;
  background:#151820;
  border-bottom:1px solid var(--line);
  padding:max(8px,env(safe-area-inset-top)) 7px 8px;
}
.top-row{
  display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.top-row::-webkit-scrollbar{display:none}
.top-btn{
  flex:1 0 auto;min-width:max-content;
  border:0;border-radius:9px;padding:10px 11px;
  background:#2b303a;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;
}
.top-btn.finish{background:var(--pink)}

/* ===== 標題 ===== */
.editor-head{padding:11px 10px 9px;text-align:center;background:#0a0c10;border-bottom:1px solid #272b34}
.editor-head .title{font-size:18px;font-weight:900}
.editor-head .sub{margin-top:3px;color:#7f8796;font-size:11px}

/* ===== 手機播放控制列 ===== */
.transport{
  display:flex;align-items:center;gap:6px;padding:8px 8px;
  background:#161920;border-bottom:1px solid var(--line);
}
.time-readout{flex:1;min-width:0;font-variant-numeric:tabular-nums;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport-btn{
  width:39px;height:39px;flex:0 0 39px;border:0;border-radius:9px;background:#2d323d;color:#fff;font-size:17px;font-weight:900
}
.transport-btn.play{background:#fff;color:#111;border-radius:50%}

/* ===== 時間軸 ===== */
.timeline-shell{position:relative;height:375px;background:#11141a;border-bottom:1px solid var(--line);overflow:hidden}
.timeline-scroll{position:relative;width:100%;height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.timeline-content{position:relative;min-width:100%;min-height:100%}
.ruler{position:absolute;left:0;top:0;width:100%;height:var(--ruler-h);background:#171a21;border-bottom:1px solid #333844;z-index:4}
.ruler-mark{position:absolute;top:0;height:var(--ruler-h);border-left:1px solid #464c59;color:#aeb4c1;font-size:10px;padding:5px 0 0 3px;white-space:nowrap}
.ruler-mark.minor{color:#68707f;font-size:0;height:12px;top:26px}
.tracks-bg{position:absolute;left:0;top:var(--ruler-h);right:0}
.track-row{position:absolute;left:0;right:0;height:var(--track-h);border-bottom:1px solid #292e38;background:rgba(255,255,255,.012)}
.clips-layer{position:absolute;inset:0;z-index:8}
.beats-layer{position:absolute;left:0;top:var(--ruler-h);right:0;bottom:0;z-index:6;pointer-events:none}
.beat-line{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,212,71,.75)}
.beat-line::before{content:"🚩";position:absolute;top:1px;left:-8px;font-size:13px}
.fixed-playhead{position:absolute;left:50%;top:var(--ruler-h);bottom:0;width:3px;background:#fff;z-index:50;pointer-events:none;box-shadow:0 0 5px #000}
.fixed-playhead::before{content:"";position:absolute;top:-5px;left:-5px;width:13px;height:13px;border-radius:3px 3px 8px 8px;background:#fff}
.empty-timeline{position:absolute;left:14px;right:14px;top:104px;text-align:center;color:#747c8b;font-size:13px;line-height:1.75;z-index:2}

/* ===== 片段 ===== */
.clip{position:absolute;height:58px;min-width:32px;border:2px solid transparent;border-radius:7px;overflow:hidden;user-select:none;touch-action:none;cursor:grab}
.clip.music{background:var(--music)}
.clip.splice{background:var(--splice)}
.clip.effect{background:var(--effect)}
.clip.selected{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.clip.dragging{opacity:.88;z-index:35;cursor:grabbing}
.clip-title{position:absolute;left:16px;right:16px;top:3px;z-index:5;font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.wave-canvas{position:absolute;left:12px;right:12px;top:18px;width:calc(100% - 24px);height:35px;pointer-events:none}
.trim-handle{position:absolute;top:0;bottom:0;width:12px;background:#fff;z-index:12;cursor:ew-resize;touch-action:none}
.trim-handle.left{left:0;border-radius:5px 0 0 5px}
.trim-handle.right{right:0;border-radius:0 5px 5px 0}
.trim-handle::after{content:"";position:absolute;left:4px;top:21px;width:4px;height:15px;border-radius:4px;background:#aab0bb}
.mute-mark{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--danger);font-size:34px;font-weight:1000;text-shadow:0 2px 4px #000;z-index:10;pointer-events:none}
.clip.muted .mute-mark{display:flex}

/* ===== 素材入口 ===== */
.material-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 9px;background:#181b22;border-bottom:1px solid var(--line)}
.material-btn{border:0;border-radius:9px;padding:11px 6px;background:#2b303a;color:#fff;font-size:13px;font-weight:900}

/* ===== 下方手機工具列，橫向滑 ===== */
.tool-dock{background:#1d2027;border-top:1px solid #2e333d;padding:7px 6px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tool-dock::-webkit-scrollbar{display:none}
.tool-btn{display:inline-flex;vertical-align:top;min-width:70px;height:62px;margin-right:4px;border:0;border-radius:8px;background:transparent;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tool-btn .ico{font-size:21px;line-height:1}
.tool-btn .txt{font-size:11px;font-weight:800}
.tool-btn:disabled{opacity:.28}

/* ===== Modal ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{width:100%;max-height:88vh;background:#20242c;border-radius:18px 18px 0 0;border:1px solid #3d4350;overflow:hidden;display:flex;flex-direction:column}
.modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#20242c;border-bottom:1px solid #373c48}
.modal-title{font-size:17px;font-weight:1000}
.modal-close{width:36px;height:36px;border:0;border-radius:50%;background:#343945;color:#fff;font-size:20px}
.modal-body{overflow:auto;padding:12px 12px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.panel-note{font-size:11px;color:#9ea5b4;line-height:1.6;margin-bottom:10px}

/* ===== 素材卡 ===== */
.material-list{display:grid;gap:8px}
.material-card{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:10px;border-radius:11px;background:#2a2e37}
.material-info{min-width:0}
.material-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-type{margin-top:3px;font-size:10px;color:#a6adba}
.material-card audio{grid-column:1/-1;width:100%;height:34px}
.mark-btn,.use-btn,.row-btn,.primary-btn{border:0;border-radius:8px;padding:9px 11px;background:#3a3f4a;color:#fff;font-weight:900;font-size:12px}
.use-btn,.primary-btn{background:var(--pink)}
.mark-btn.music.on{color:#ff557b}
.mark-btn.splice.on{color:#c5afff}
.mark-btn.effect.on{color:#ffd447}

/* ===== 草稿 / 成品 ===== */
.list-row{padding:11px;margin-bottom:8px;border-radius:10px;background:#2a2e37}
.list-name{font-weight:900;font-size:13px;word-break:break-word}
.list-meta{margin-top:4px;color:#9ea5b4;font-size:10px}
.list-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.list-row audio{width:100%;margin-top:8px}
.form-group{margin-bottom:13px}
.form-group label{display:block;margin-bottom:6px;color:#d2d5dc;font-size:12px}
.form-group input,.form-group select{width:100%;padding:10px;border-radius:8px;border:1px solid #454b58;background:#15181e;color:#fff}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:none;max-width:88vw;padding:10px 15px;border-radius:22px;background:rgba(0,0,0,.94);color:#fff;font-size:12px;text-align:center}

@media(min-width:700px){
  body{max-width:520px;margin:0 auto;border-left:1px solid #232832;border-right:1px solid #232832}
  .app-top{max-width:520px;margin:0 auto}
}
</style>
</head>
<body>

<!-- 最上方 5 顆 -->
<header class="app-top">
  <div class="top-row">
    <button id="backBtn" class="top-btn">← 回音樂素材</button>
    <button id="uploadBtn" class="top-btn">⬆️ 上傳音樂</button>
    <button id="draftsBtn" class="top-btn">📝 草稿</button>
    <button id="productsBtn" class="top-btn">🎵 成品</button>
    <button id="finishBtn" class="top-btn finish">✅ 完成</button>
  </div>
</header>

<input id="uploadInput" type="file" accept="audio/*" multiple hidden>

<section class="editor-head">
  <div class="title">🎧 自由品勢音樂剪輯</div>
  <div class="sub">手機版｜真正波形｜動態多軌｜自由拖曳</div>
</section>

<!-- 手機播放控制 -->
<section class="transport">
  <div id="timeReadout" class="time-readout">00:00.0 / 00:00.0</div>
  <button id="playBtn" class="transport-btn play" title="播放">▶</button>
  <button id="undoBtn" class="transport-btn" title="回上一步">↶</button>
  <button id="redoBtn" class="transport-btn" title="重做">↷</button>
  <button id="fullscreenBtn" class="transport-btn" title="全螢幕">⛶</button>
</section>

<!-- 時間軸 -->
<section id="timelineShell" class="timeline-shell">
  <div id="timelineScroll" class="timeline-scroll">
    <div id="timelineContent" class="timeline-content">
      <div id="ruler" class="ruler"></div>
      <div id="tracksBg" class="tracks-bg"></div>
      <div id="beatsLayer" class="beats-layer"></div>
      <div id="clipsLayer" class="clips-layer"></div>
      <div id="emptyTimeline" class="empty-timeline">
        還沒有素材<br>
        按「🎵 音樂／✂️ 拼接／🔊 音效」從素材庫加入<br>
        或按「⬆️ 上傳音樂」加入手機裡自己的音樂
      </div>
    </div>
  </div>
  <div class="fixed-playhead"></div>
</section>

<!-- 素材入口 -->
<section class="material-tabs">
  <button class="material-btn" data-type="music">🎵 音樂</button>
  <button class="material-btn" data-type="splice">✂️ 拼接</button>
  <button class="material-btn" data-type="effect">🔊 音效</button>
</section>

<!-- 下方工具列 -->
<section class="tool-dock">
  <button id="volumeBtn" class="tool-btn need-clip" disabled><span class="ico">🔊</span><span class="txt">音量</span></button>
  <button id="fadeBtn" class="tool-btn need-clip" disabled><span class="ico">◐</span><span class="txt">淡入淡出</span></button>
  <button id="splitBtn" class="tool-btn need-clip" disabled><span class="ico">✂️</span><span class="txt">分割</span></button>
  <button id="deleteBtn" class="tool-btn need-clip" disabled><span class="ico">🗑️</span><span class="txt">刪除</span></button>
  <button id="copyBtn" class="tool-btn need-clip" disabled><span class="ico">⧉</span><span class="txt">複製</span></button>
  <button id="speedBtn" class="tool-btn need-clip" disabled><span class="ico">⏱️</span><span class="txt">變速</span></button>
  <button id="muteBtn" class="tool-btn need-clip" disabled><span class="ico">🔇</span><span class="txt">靜音</span></button>
  <button id="beatBtn" class="tool-btn"><span class="ico">🚩</span><span class="txt">節拍</span></button>
</section>

<!-- Modal -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <button id="modalClose" class="modal-close">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   固定設定
   ========================================================= */
const LIBRARY_BASE = "https://13579jo.github.io/taekwondo-music-library/";
const REPO_TREE_API = "https://api.github.com/repos/13579jo/taekwondo-music-library/git/trees/main?recursive=1";
const PPS = 46;              // 手機版每秒 46px，像剪映每秒清楚可見
const RULER_H = 38;
const TRACK_H = 70;
const MIN_CLIP = 0.20;
const DEFAULT_DURATION = 100;
const AUDIO_EXT = /\.(mp3|wav|m4a|aac|ogg|flac)$/i;
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioContext = new AudioContextClass();

/* =========================================================
   編輯資料
   ========================================================= */
let clips = [];
let beats = [];
let assets = new Map();
let selectedClipId = null;
let undoStack = [];
let redoStack = [];
let isPlaying = false;
let activeSources = [];
let playRAF = 0;
let playStartCtx = 0;
let playStartTimeline = 0;
let libraryManifest = null;
let libraryManifestPromise = null;

/* =========================================================
   DOM
   ========================================================= */
const timelineShell = document.getElementById("timelineShell");
const timelineScroll = document.getElementById("timelineScroll");
const timelineContent = document.getElementById("timelineContent");
const ruler = document.getElementById("ruler");
const tracksBg = document.getElementById("tracksBg");
const beatsLayer = document.getElementById("beatsLayer");
const clipsLayer = document.getElementById("clipsLayer");
const emptyTimeline = document.getElementById("emptyTimeline");
const timeReadout = document.getElementById("timeReadout");
const uploadInput = document.getElementById("uploadInput");

/* =========================================================
   上方 5 顆
   ========================================================= */
document.getElementById("backBtn").addEventListener("click",()=>location.href=LIBRARY_BASE);
document.getElementById("uploadBtn").addEventListener("click",()=>uploadInput.click());
document.getElementById("draftsBtn").addEventListener("click",showDrafts);
document.getElementById("productsBtn").addEventListener("click",showProducts);
document.getElementById("finishBtn").addEventListener("click",finishProject);

/* =========================================================
   播放控制
   ========================================================= */
document.getElementById("playBtn").addEventListener("click",togglePlay);
document.getElementById("undoBtn").addEventListener("click",undoAction);
document.getElementById("redoBtn").addEventListener("click",redoAction);
document.getElementById("fullscreenBtn").addEventListener("click",toggleFullscreen);

/* =========================================================
   下方工具
   ========================================================= */
document.getElementById("volumeBtn").addEventListener("click",editVolume);
document.getElementById("fadeBtn").addEventListener("click",editFade);
document.getElementById("splitBtn").addEventListener("click",splitSelected);
document.getElementById("deleteBtn").addEventListener("click",deleteSelected);
document.getElementById("copyBtn").addEventListener("click",copySelected);
document.getElementById("speedBtn").addEventListener("click",editSpeed);
document.getElementById("muteBtn").addEventListener("click",toggleMute);
document.getElementById("beatBtn").addEventListener("click",addBeat);

/* =========================================================
   自己上傳音樂：只有這裡會開手機檔案
   ========================================================= */
uploadInput.addEventListener("change",async e=>{
  const files=[...e.target.files];
  e.target.value="";
  if(files.length) await addUploadedFiles(files);
});

/* =========================================================
   素材庫三入口：永遠讀我們自己的素材庫
   ========================================================= */
document.querySelectorAll(".material-btn").forEach(btn=>{
  btn.addEventListener("click",()=>openMaterialPanel(btn.dataset.type));
});

/* =========================================================
   全螢幕
   ========================================================= */
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else return showToast("這支手機瀏覽器目前不支援全螢幕");
    }else{
      await document.exitFullscreen();
    }
  }catch(e){
    showToast("這支手機瀏覽器目前不支援全螢幕");
  }
}

/* =========================================================
   自動讀取 GitHub 素材庫「全部音訊檔」
   未來新增素材，只要放進素材庫 Repo，重新整理就會出現
   ========================================================= */
async function loadLibraryManifest(){
  if(libraryManifest) return libraryManifest;
  if(libraryManifestPromise) return libraryManifestPromise;

  libraryManifestPromise=(async()=>{
    let paths=[];

    /* 第一選擇：GitHub repository tree，自動拿全部檔案 */
    try{
      const r=await fetch(REPO_TREE_API,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
      if(r.ok){
        const data=await r.json();
        paths=(data.tree||[])
          .filter(x=>x.type==="blob" && AUDIO_EXT.test(x.path||""))
          .map(x=>x.path);
      }
    }catch(e){console.warn("GitHub tree 讀取失敗",e)}

    /* 第二選擇：如果 API 暫時失敗，就從素材庫首頁抓出音訊連結 */
    if(!paths.length){
      try{
        const r=await fetch(LIBRARY_BASE,{cache:"no-store"});
        if(r.ok){
          const html=await r.text();
          const re=/["'`]([^"'`<>]+\.(?:mp3|wav|m4a|aac|ogg|flac))["'`]/gi;
          const set=new Set();
          let m;
          while((m=re.exec(html))){
            let p=m[1];
            try{
              const u=new URL(p,LIBRARY_BASE);
              if(u.origin===location.origin && u.pathname.includes("/taekwondo-music-library/")){
                p=decodeURIComponent(u.pathname.split("/taekwondo-music-library/")[1]||"");
                if(p && AUDIO_EXT.test(p)) set.add(p);
              }
            }catch{}
          }
          paths=[...set];
        }
      }catch(e){console.warn("素材庫首頁讀取失敗",e)}
    }

    const all=paths
      .filter(Boolean)
      .filter(p=>!p.startsWith("."))
      .map(path=>materialFromPath(path))
      .filter(Boolean);

    /* 去除重複 */
    const unique=new Map();
    all.forEach(m=>unique.set(m.path,m));
    const list=[...unique.values()];

    libraryManifest={
      music:list.filter(x=>x.type==="music"),
      splice:list.filter(x=>x.type==="splice"),
      effect:list.filter(x=>x.type==="effect")
    };

    Object.values(libraryManifest).forEach(arr=>arr.sort(naturalMaterialSort));
    return libraryManifest;
  })();

  try{return await libraryManifestPromise}
  finally{libraryManifestPromise=null}
}

function materialFromPath(path){
  const clean=String(path).replace(/^\/+/,"");
  if(!AUDIO_EXT.test(clean)) return null;

  const decoded=safeDecode(clean);
  const lower=decoded.toLowerCase();
  const filename=decoded.split("/").pop()||decoded;
  const base=filename.replace(/\.[^.]+$/,"");
  let type="music";

  if(lower.includes("拼接素材") || lower.includes("/splice") || base.includes("拼接")){
    type="splice";
  }else if(lower.includes("音效") || /(^|\/|_)effect\d*/i.test(lower) || /effect/i.test(base)){
    type="effect";
  }else if(lower.includes("音樂") || /(^|\/|_)music\d*/i.test(lower) || /music/i.test(base)){
    type="music";
  }else{
    /* 素材庫裡其他沒有分類字樣的音訊，預設視為音樂，避免漏掉新音樂 */
    type="music";
  }

  const number=extractNumber(base);
  let id;
  if(type==="music" && /^music\s*\d+/i.test(base)) id=base.replace(/\s+/g,"").toLowerCase();
  else if(type==="effect" && /^effect\s*\d+/i.test(base)) id=base.replace(/\s+/g,"").toLowerCase();
  else if(type==="splice" && number!=null) id=`splice${String(number).padStart(2,"0")}`;
  else id=`${type}_${slugify(base)}`;

  let title=base;
  if(type==="music" && number!=null && /^music/i.test(base)) title=`音樂 ${String(number).padStart(2,"0")}`;
  if(type==="effect" && number!=null && /^effect/i.test(base)) title=`音效 ${String(number).padStart(2,"0")}`;
  if(type==="splice" && number!=null) title=`拼接 ${String(number).padStart(2,"0")}`;

  return{
    id,type,title,path:clean,base,number,
    url:new URL(clean,LIBRARY_BASE).href
  };
}

function safeDecode(s){try{return decodeURIComponent(s)}catch{return s}}
function slugify(s){return String(s).trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9\u4e00-\u9fff_-]+/g,"").slice(0,80)||uid("item")}
function extractNumber(s){const m=String(s).match(/\d+/);return m?Number(m[0]):null}
function naturalMaterialSort(a,b){return a.title.localeCompare(b.title,"zh-Hant",{numeric:true,sensitivity:"base"})}

/* =========================================================
   標記同步：使用同一個 origin 的 localStorage
   已標記的一律排最上面
   ========================================================= */
function markAliases(m){
  const arr=[m.id,m.base,slugify(m.base)];
  if(m.number!=null){
    const n=m.number;
    const pad=String(n).padStart(2,"0");
    if(m.type==="music") arr.push(`music${pad}`,`music${n}`);
    if(m.type==="effect") arr.push(`effect${pad}`,`effect${n}`);
    if(m.type==="splice") arr.push(`splice${pad}`,`splice${n}`,`${n}_拼接素材`,`拼接${n}`);
  }
  return [...new Set(arr.filter(Boolean))];
}
function isMarked(m){
  return markAliases(m).some(id=>localStorage.getItem("favorite_"+id)==="true");
}
function setMarked(m,value){
  markAliases(m).forEach(id=>localStorage.setItem("favorite_"+id,value?"true":"false"));
}
function materialSortMarked(a,b){
  const marked=Number(isMarked(b))-Number(isMarked(a));
  return marked || naturalMaterialSort(a,b);
}

function bindMaterialPanel(type){

/* =========================================================
   加入素材庫音訊
   ========================================================= */
async function addLibraryMaterial(m){
  await audioContext.resume();
  const response=await fetch(m.url,{cache:"no-store"});
  if(!response.ok) throw new Error("HTTP "+response.status);
  const blob=await response.blob();
  const buffer=await audioContext.decodeAudioData((await blob.arrayBuffer()).slice(0));
  const assetId=uid("asset");
  assets.set(assetId,{
    id:assetId,name:m.title,type:m.type,blob,buffer,duration:buffer.duration,
    peaks:createPeaks(buffer,6000),sourceUrl:m.url,materialId:m.id
  });
  addNewClipFromAsset(assetId,m.title,m.type,true);
}

/* =========================================================
   加入手機自己的音樂
   ========================================================= */
async function addUploadedFiles(files){
  const before=snapshot();
  let added=0;
  for(const file of files){
    try{
      showToast("正在讀取音樂波形…");
      const buffer=await audioContext.decodeAudioData((await file.arrayBuffer()).slice(0));
      const assetId=uid("asset");
      assets.set(assetId,{id:assetId,name:file.name,type:"music",blob:file,buffer,duration:buffer.duration,peaks:createPeaks(buffer,6000),sourceUrl:null,materialId:null});
      addNewClipFromAsset(assetId,file.name,"music",false);
      added++;
    }catch(e){console.error(e);showToast("⚠️ 有音訊檔無法讀取")}
  }
  if(added){pushUndoSnapshot(before);normalizeTracks();renderAll();showToast("✅ 已加入自己的音樂")}
}

function addNewClipFromAsset(assetId,name,type,saveHistory=true){
  const a=assets.get(assetId);if(!a) return;
  if(saveHistory) saveUndo();
  const newTrack=clips.length?Math.max(...clips.map(c=>c.track))+1:0;
  clips.push({
    id:uid("clip"),assetId,name,type,track:newTrack,start:getPlayheadTime(),
    trimStart:0,trimEnd:a.duration,volume:1,muted:false,speed:1,fadeIn:0,fadeOut:0
  });
  normalizeTracks();renderAll();
}

/* =========================================================
   真實波形分析
   ========================================================= */
function createPeaks(buffer,count){
  const n=Math.max(1,Math.min(count,buffer.length));
  const peaks=new Float32Array(n);const step=buffer.length/n;
  for(let i=0;i<n;i++){
    const s=Math.floor(i*step),e=Math.min(buffer.length,Math.floor((i+1)*step));let max=0;
    for(let ch=0;ch<buffer.numberOfChannels;ch++){
      const data=buffer.getChannelData(ch);
      for(let j=s;j<e;j++){const v=Math.abs(data[j]);if(v>max)max=v}
    }
    peaks[i]=max;
  }
  return peaks;
}

/* =========================================================
   時間軸計算
   ========================================================= */
function clipDuration(c){return Math.max(MIN_CLIP,(c.trimEnd-c.trimStart)/c.speed)}
function clipEnd(c){return c.start+clipDuration(c)}
function projectDuration(){return Math.max(0,...clips.map(clipEnd),...beats,0)}
function getSelected(){return clips.find(c=>c.id===selectedClipId)||null}
function leftPad(){return timelineShell.clientWidth/2}
function getPlayheadTime(){return Math.max(0,timelineScroll.scrollLeft/PPS)}
function setPlayheadTime(t){timelineScroll.scrollLeft=Math.max(0,t*PPS)}
function trackCount(){return clips.length?Math.max(...clips.map(c=>c.track))+1:0}

/* =========================================================
   畫全部
   ========================================================= */
function renderAll(){
  const keepLeft=timelineScroll.scrollLeft,keepTop=timelineScroll.scrollTop;
  const pad=leftPad();
  const duration=Math.max(DEFAULT_DURATION,Math.ceil(projectDuration()+8));
  const tracks=trackCount();

  timelineContent.style.width=(pad*2+duration*PPS)+"px";
  timelineContent.style.height=(RULER_H+Math.max(260,tracks*TRACK_H+60))+"px";
  renderRuler(duration,pad);renderTracks(tracks);renderBeats(pad);renderClips(pad);
  emptyTimeline.style.display=clips.length?"none":"block";
  updateToolState();updateTimeReadout();

  requestAnimationFrame(()=>{timelineScroll.scrollLeft=keepLeft;timelineScroll.scrollTop=keepTop});
}

function renderRuler(duration,pad){
  ruler.innerHTML="";
  for(let t=0;t<=duration;t++){
    const m=document.createElement("div");
    m.className="ruler-mark";
    m.style.left=(pad+t*PPS)+"px";
    m.textContent=formatTime(t);
    ruler.appendChild(m);
    if(t<duration){
      const half=document.createElement("div");
      half.className="ruler-mark minor";
      half.style.left=(pad+(t+.5)*PPS)+"px";
      ruler.appendChild(half);
    }
  }
}

function renderTracks(count){
  tracksBg.innerHTML="";
  for(let i=0;i<count;i++){
    const row=document.createElement("div");row.className="track-row";row.style.top=(i*TRACK_H)+"px";tracksBg.appendChild(row);
  }
}

function renderBeats(pad){
  beatsLayer.innerHTML="";
  beats.forEach(t=>{const b=document.createElement("div");b.className="beat-line";b.style.left=(pad+t*PPS)+"px";beatsLayer.appendChild(b)});
}

function renderClips(pad){
  clipsLayer.innerHTML="";
  clips.forEach(c=>{
    const a=assets.get(c.assetId);if(!a)return;
    const el=document.createElement("div");
    el.className=`clip ${c.type}${c.id===selectedClipId?" selected":""}${c.muted?" muted":""}`;
    el.dataset.id=c.id;
    el.style.left=(pad+c.start*PPS)+"px";
    el.style.top=(RULER_H+c.track*TRACK_H+6)+"px";
    el.style.width=Math.max(32,clipDuration(c)*PPS)+"px";
    el.innerHTML=`
      <div class="clip-title">${escapeHtml(c.name)}</div>
      <canvas class="wave-canvas"></canvas>
      <div class="trim-handle left"></div>
      <div class="trim-handle right"></div>
      <div class="mute-mark">×</div>`;
    clipsLayer.appendChild(el);
    drawWave(el.querySelector("canvas"),c,a);
    bindClipEvents(el,c);
  });
}

function drawWave(canvas,c,a){
  const w=Math.max(1,Math.floor(canvas.clientWidth)),h=Math.max(1,Math.floor(canvas.clientHeight)),dpr=window.devicePixelRatio||1;
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
  const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const start=Math.floor((c.trimStart/a.duration)*a.peaks.length);
  const end=Math.max(start+1,Math.floor((c.trimEnd/a.duration)*a.peaks.length));
  const mid=h/2;ctx.beginPath();
  for(let x=0;x<w;x++){
    const idx=Math.min(a.peaks.length-1,start+Math.floor((x/Math.max(1,w-1))*(end-start)));
    const y=(a.peaks[idx]||0)*mid*.95;
    if(x===0)ctx.moveTo(x,mid-y);else ctx.lineTo(x,mid-y);
  }
  for(let x=w-1;x>=0;x--){
    const idx=Math.min(a.peaks.length-1,start+Math.floor((x/Math.max(1,w-1))*(end-start)));
    const y=(a.peaks[idx]||0)*mid*.95;ctx.lineTo(x,mid+y);
  }
  ctx.closePath();ctx.fillStyle="rgba(255,255,255,.94)";ctx.fill();
}

/* =========================================================
   選取 / 拖動 / 裁切
   ========================================================= */
function bindClipEvents(el,c){
  el.addEventListener("click",e=>{
    if(e.target.classList.contains("trim-handle"))return;
    selectedClipId=c.id;renderAll();
  });

  el.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("trim-handle"))return;
    if(e.button!==0)return;
    startClipDrag(e,el,c);
  });

  el.querySelector(".trim-handle.left").addEventListener("pointerdown",e=>startTrim(e,el,c,"left"));
  el.querySelector(".trim-handle.right").addEventListener("pointerdown",e=>startTrim(e,el,c,"right"));
}

function startClipDrag(e,el,c){
  e.preventDefault();e.stopPropagation();selectedClipId=c.id;
  const before=snapshot(),sx=e.clientX,sy=e.clientY,oldStart=c.start,oldTrack=c.track;
  const maxTrack=trackCount();let moved=false;
  el.classList.add("dragging");

  function move(ev){
    if(Math.abs(ev.clientX-sx)>3 || Math.abs(ev.clientY-sy)>3)moved=true;
    c.start=Math.max(0,oldStart+(ev.clientX-sx)/PPS);
    c.track=Math.max(0,Math.min(maxTrack,oldTrack+Math.round((ev.clientY-sy)/TRACK_H)));
    const pad=leftPad();
    el.style.left=(pad+c.start*PPS)+"px";
    el.style.top=(RULER_H+c.track*TRACK_H+6)+"px";
  }

  function up(){
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
    if(moved){pushCollisions(c);normalizeTracks();pushUndoSnapshot(before)}
    renderAll();
  }
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}

function startTrim(e,el,c,side){
  e.preventDefault();e.stopPropagation();selectedClipId=c.id;
  const before=snapshot(),sx=e.clientX,oldStart=c.start,oldTrimStart=c.trimStart,oldTrimEnd=c.trimEnd,a=assets.get(c.assetId);
  let changed=false;

  function move(ev){
    changed=true;
    const deltaTimeline=(ev.clientX-sx)/PPS,deltaSource=deltaTimeline*c.speed;
    if(side==="right"){
      c.trimEnd=Math.min(a.duration,Math.max(oldTrimStart+MIN_CLIP*c.speed,oldTrimEnd+deltaSource));
    }else{
      const earliestTrim=Math.max(0,oldTrimStart-oldStart*c.speed);
      const newTrim=Math.min(oldTrimEnd-MIN_CLIP*c.speed,Math.max(earliestTrim,oldTrimStart+deltaSource));
      const shift=(newTrim-oldTrimStart)/c.speed;
      c.trimStart=newTrim;c.start=oldStart+shift;
    }
    const pad=leftPad();el.style.left=(pad+c.start*PPS)+"px";el.style.width=Math.max(32,clipDuration(c)*PPS)+"px";
    drawWave(el.querySelector("canvas"),c,a);
  }

  function up(){
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
    if(changed){pushCollisions(c);normalizeTracks();pushUndoSnapshot(before)}
    renderAll();
  }
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}

/* =========================================================
   同軌碰撞自動讓位 / 空軌收掉
   ========================================================= */
function overlaps(a,b){return a.track===b.track && a.start<clipEnd(b)-.001 && clipEnd(a)>b.start+.001}
function pushCollisions(moved){
  const queue=[moved];let guard=0;
  while(queue.length && guard++<300){
    const cur=queue.shift(),end=clipEnd(cur);
    clips.forEach(other=>{
      if(other.id!==cur.id && other.track===cur.track && overlaps(cur,other)){
        other.start=end+.02;queue.push(other);
      }
    });
  }
}
function normalizeTracks(){
  if(!clips.length)return;
  const used=[...new Set(clips.map(c=>c.track))].sort((a,b)=>a-b);
  const map=new Map(used.map((v,i)=>[v,i]));clips.forEach(c=>c.track=map.get(c.track));
}

   時間軸移動：白線固定，左右滑時間軸

/* =========================================================
   Undo / Redo
   ========================================================= */
function snapshot(){return JSON.stringify({clips:clips.map(c=>({...c})),beats:[...beats]})}
function pushUndoSnapshot(s){undoStack.push(s);if(undoStack.length>80)undoStack.shift();redoStack=[];updateToolState()}
function saveUndo(){pushUndoSnapshot(snapshot())}
function restoreSnapshot(s){const x=JSON.parse(s);clips=x.clips||[];beats=x.beats||[];selectedClipId=null;normalizeTracks();renderAll()}
function undoAction(){
  if(!undoStack.length)return showToast("沒有可以回上一步的動作");
  redoStack.push(snapshot());restoreSnapshot(undoStack.pop());showToast("↶ 已回上一步");
}
function redoAction(){
  if(!redoStack.length)return showToast("沒有可以重做的動作");
  undoStack.push(snapshot());restoreSnapshot(redoStack.pop());showToast("↷ 已重做");
}

/* =========================================================
   真正多軌播放
   ========================================================= */
async function togglePlay(){
  if(isPlaying){stopPlayback();return}
  if(!clips.length)return showToast("請先加入素材");
  await audioContext.resume();startPlayback();
}

function startPlayback(){
  stopPlayback();isPlaying=true;document.getElementById("playBtn").textContent="■";
  playStartTimeline=getPlayheadTime();playStartCtx=audioContext.currentTime;activeSources=[];

  clips.forEach(c=>{
    if(c.muted)return;
    const a=assets.get(c.assetId);if(!a || clipEnd(c)<=playStartTimeline)return;
    const timelineStart=Math.max(playStartTimeline,c.start);
    const delay=timelineStart-playStartTimeline;
    const sourceOffset=c.trimStart+(timelineStart-c.start)*c.speed;
    const sourceDuration=Math.max(0,c.trimEnd-sourceOffset);if(sourceDuration<=0)return;
    const source=audioContext.createBufferSource(),gain=audioContext.createGain();
    source.buffer=a.buffer;source.playbackRate.value=c.speed;source.connect(gain).connect(audioContext.destination);
    const when=audioContext.currentTime+delay,timelineDur=sourceDuration/c.speed,base=c.volume,relative=timelineStart-c.start;
    let initial=base;
    if(c.fadeIn>0 && relative<c.fadeIn)initial=base*(relative/c.fadeIn);
    if(c.fadeOut>0 && relative>clipDuration(c)-c.fadeOut)initial=Math.min(initial,base*((clipDuration(c)-relative)/c.fadeOut));
    gain.gain.setValueAtTime(Math.max(0,initial),when);
    if(c.fadeIn>0 && relative<c.fadeIn)gain.gain.linearRampToValueAtTime(base,when+(c.fadeIn-relative));
    const fadeOutStart=clipDuration(c)-c.fadeOut;
    if(c.fadeOut>0){
      if(relative<fadeOutStart){gain.gain.setValueAtTime(base,when+(fadeOutStart-relative));gain.gain.linearRampToValueAtTime(0,when+timelineDur)}
      else gain.gain.linearRampToValueAtTime(0,when+timelineDur);
    }
    source.start(when,sourceOffset,sourceDuration);activeSources.push(source);
  });
  animatePlayback();
}

function animatePlayback(){
  if(!isPlaying)return;
  const t=playStartTimeline+(audioContext.currentTime-playStartCtx);
  setPlayheadTime(t);updateTimeReadout();
  if(t>=projectDuration()+.03){stopPlayback();return}
  playRAF=requestAnimationFrame(animatePlayback);
}

function stopPlayback(){
  activeSources.forEach(s=>{try{s.stop()}catch{}});activeSources=[];cancelAnimationFrame(playRAF);
  if(isPlaying){isPlaying=false;document.getElementById("playBtn").textContent="▶"}
}

/* =========================================================
   完成：合成 WAV + 自動下載 + 成品 + 草稿
   ========================================================= */
async function finishProject(){
  if(!clips.length)return showToast("請先加入素材");
  stopPlayback();
  const def=makeDefaultName();
  const name=(prompt("請輸入作品名稱",def)||def).trim()||def;
  try{
    showToast("正在合成成品…");
    const wavBlob=await renderMixToWav();
    const now=new Date(),productId=uid("product"),draftId=uid("draft"),assetRecords=await collectProjectAssets();
    await dbPut("products",{id:productId,name,createdAt:now.toISOString(),duration:projectDuration(),blob:wavBlob});
    await dbPut("drafts",{id:draftId,name,createdAt:now.toISOString(),duration:projectDuration(),clips:clips.map(c=>({...c})),beats:[...beats],assets:assetRecords,finalBlob:wavBlob,productId});
    downloadBlob(wavBlob,name+".wav");
    showToast("✅ 已下載，並新增成品與草稿");
  }catch(e){console.error(e);showToast("⚠️ 完成失敗，請再試一次")}
}

async function renderMixToWav(){
  const duration=Math.max(.1,projectDuration()),rate=44100;
  const OfflineCtx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!OfflineCtx)throw new Error("OfflineAudioContext unsupported");
  const offline=new OfflineCtx(2,Math.ceil(duration*rate),rate);

  clips.forEach(c=>{
    if(c.muted)return;
    const a=assets.get(c.assetId);if(!a)return;
    const source=offline.createBufferSource(),gain=offline.createGain();
    source.buffer=a.buffer;source.playbackRate.value=c.speed;source.connect(gain).connect(offline.destination);
    const start=c.start,d=clipDuration(c),g=c.volume;
    gain.gain.setValueAtTime(c.fadeIn>0?0:g,start);
    if(c.fadeIn>0)gain.gain.linearRampToValueAtTime(g,start+Math.min(c.fadeIn,d));
    if(c.fadeOut>0){const fs=Math.max(start,start+d-c.fadeOut);gain.gain.setValueAtTime(g,fs);gain.gain.linearRampToValueAtTime(0,start+d)}
    source.start(start,c.trimStart,c.trimEnd-c.trimStart);
  });
  return audioBufferToWavBlob(await offline.startRendering());
}

function audioBufferToWavBlob(buffer){
  const channels=buffer.numberOfChannels,rate=buffer.sampleRate,length=buffer.length,block=channels*2;
  const ab=new ArrayBuffer(44+length*block),view=new DataView(ab);let p=0;
  const str=s=>{for(let i=0;i<s.length;i++)view.setUint8(p++,s.charCodeAt(i))};
  str("RIFF");view.setUint32(p,36+length*block,true);p+=4;str("WAVE");str("fmt ");view.setUint32(p,16,true);p+=4;
  view.setUint16(p,1,true);p+=2;view.setUint16(p,channels,true);p+=2;view.setUint32(p,rate,true);p+=4;
  view.setUint32(p,rate*block,true);p+=4;view.setUint16(p,block,true);p+=2;view.setUint16(p,16,true);p+=2;str("data");view.setUint32(p,length*block,true);p+=4;
  const data=Array.from({length:channels},(_,ch)=>buffer.getChannelData(ch));
  for(let i=0;i<length;i++)for(let ch=0;ch<channels;ch++){
    const s=Math.max(-1,Math.min(1,data[ch][i]));view.setInt16(p,s<0?s*0x8000:s*0x7fff,true);p+=2;
  }
  return new Blob([ab],{type:"audio/wav"});
}

/* =========================================================
   草稿：新增保存，不覆蓋，不刪除
   ========================================================= */
async function showDrafts(){
  const list=(await dbGetAll("drafts")).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  openModal("📝 草稿",`
    <div class="panel-note">草稿會保存在目前這支手機的這個瀏覽器。每次「保留」都新增一份，不覆蓋舊草稿；不提供刪除。</div>
    <button id="saveDraftNow" class="primary-btn">＋ 保留目前草稿</button>
    <div style="height:10px"></div>
    ${list.length?list.map(d=>`
      <div class="list-row">
        <div class="list-name">${escapeHtml(d.name)}</div>
        <div class="list-meta">${new Date(d.createdAt).toLocaleString()} ｜ ${formatPrecise(d.duration)}</div>
        <div class="list-actions">
          <button class="row-btn" data-open-draft="${d.id}">開啟繼續剪輯</button>
          ${d.finalBlob?`<button class="row-btn" data-download-draft="${d.id}">下載成品</button>`:""}
        </div>
      </div>`).join(""):`<div class="panel-note">目前還沒有草稿。</div>`}
  `);

  document.getElementById("saveDraftNow").addEventListener("click",saveCurrentDraft);
  document.querySelectorAll("[data-open-draft]").forEach(b=>b.addEventListener("click",()=>loadDraft(b.dataset.openDraft)));
  document.querySelectorAll("[data-download-draft]").forEach(b=>b.addEventListener("click",async()=>{
    const d=await dbGet("drafts",b.dataset.downloadDraft);if(d?.finalBlob)downloadBlob(d.finalBlob,d.name+".wav");
  }));
}

async function saveCurrentDraft(){
  if(!clips.length)return showToast("目前沒有可以保存的剪輯內容");
  const def=makeDefaultName()+"_草稿";
  const name=(prompt("草稿名稱",def)||def).trim()||def;
  const assetRecords=await collectProjectAssets();
  await dbPut("drafts",{
    id:uid("draft"),name,createdAt:new Date().toISOString(),duration:projectDuration(),
    clips:clips.map(c=>({...c})),beats:[...beats],assets:assetRecords,finalBlob:null,productId:null
  });
  closeModal();showToast("📝 已保留新草稿，不覆蓋舊草稿");
}

async function collectProjectAssets(){
  const used=[...new Set(clips.map(c=>c.assetId))],arr=[];
  for(const id of used){
    const a=assets.get(id);if(a)arr.push({id:a.id,name:a.name,type:a.type,blob:a.blob,sourceUrl:a.sourceUrl||null,materialId:a.materialId||null});
  }
  return arr;
}

async function loadDraft(id){
  const d=await dbGet("drafts",id);if(!d)return;
  stopPlayback();assets.clear();
  for(const a of d.assets){
    const buffer=await audioContext.decodeAudioData((await a.blob.arrayBuffer()).slice(0));
    assets.set(a.id,{...a,buffer,duration:buffer.duration,peaks:createPeaks(buffer,6000)});
  }
  clips=(d.clips||[]).map(c=>({...c}));beats=[...(d.beats||[])];selectedClipId=null;undoStack=[];redoStack=[];
  closeModal();normalizeTracks();renderAll();setPlayheadTime(0);showToast("📝 已開啟草稿，可繼續剪輯");
}

/* =========================================================
   成品：試聽 / 改檔名 / 下載，不刪除
   ========================================================= */
async function showProducts(){
  const list=(await dbGetAll("products")).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  openModal("🎵 成品",`
    <div class="panel-note">成品保存在目前這支手機的這個瀏覽器。可以試聽、改檔名、下載；不提供刪除。</div>
    ${list.length?list.map(p=>{
      const url=URL.createObjectURL(p.blob);
      return `<div class="list-row">
        <div class="list-name">${escapeHtml(p.name)}</div>
        <div class="list-meta">${new Date(p.createdAt).toLocaleString()} ｜ ${formatPrecise(p.duration)}</div>
        <audio controls src="${url}"></audio>
        <div class="list-actions">
          <button class="row-btn" data-rename-product="${p.id}">✏️ 改檔名</button>
          <button class="row-btn" data-download-product="${p.id}">⬇️ 下載</button>
        </div>
      </div>`;
    }).join(""):`<div class="panel-note">目前還沒有成品。</div>`}
  `);

  document.querySelectorAll("[data-download-product]").forEach(b=>b.addEventListener("click",async()=>{
    const p=await dbGet("products",b.dataset.downloadProduct);if(p)downloadBlob(p.blob,p.name+".wav");
  }));
  document.querySelectorAll("[data-rename-product]").forEach(b=>b.addEventListener("click",async()=>{
    const p=await dbGet("products",b.dataset.renameProduct);if(!p)return;
    const n=prompt("輸入新的成品名稱",p.name);if(!n||!n.trim())return;
    p.name=n.trim();await dbPut("products",p);showProducts();
  }));
}

/* =========================================================
   IndexedDB
   ========================================================= */
const DB_NAME="taekwondo_editor_mobile_v1",DB_VERSION=1;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains("drafts"))db.createObjectStore("drafts",{keyPath:"id"});
      if(!db.objectStoreNames.contains("products"))db.createObjectStore("products",{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbPut(store,value){
  const db=await openDB();return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(value);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbGetAll(store){
  const db=await openDB();return new Promise((resolve,reject)=>{
    const req=db.transaction(store,"readonly").objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbGet(store,id){
  const db=await openDB();return new Promise((resolve,reject)=>{
    const req=db.transaction(store,"readonly").objectStore(store).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}

/* =========================================================
   Modal / Toast / Utils
   ========================================================= */
function openModal(title,html){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
document.getElementById("modalClose").addEventListener("click",closeModal);
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});

function showToast(text){
  const t=document.getElementById("toast");t.textContent=text;t.style.display="block";clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.style.display="none",1800);
}
function uid(prefix="id"){return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function escapeHtml(t){return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatTime(sec){sec=Math.max(0,sec||0);const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function formatPrecise(sec){sec=Math.max(0,sec||0);const m=Math.floor(sec/60),s=(sec%60).toFixed(1).padStart(4,"0");return `${String(m).padStart(2,"0")}:${s}`}
function makeDefaultName(){
  const d=new Date();return `自由品勢作品_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`;
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);
}

   啟動

renderAll();
loadLibraryManifest().catch(()=>{}); // 預先讀素材庫，按分類時更快
