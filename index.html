<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>自由品勢剪輯器</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #101010;
  --panel: #181818;
  --panel2: #242424;
  --line: #363636;

  --text: #ffffff;
  --sub: #a9a9a9;

  --pink: #ff2c68;
  --purple: #7655e8;

  --music: #079ba8;
  --splice: #7655e8;
  --effect: #cf8516;
}

body {
  margin: 0;

  background: var(--bg);
  color: var(--text);

  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;

  overflow: hidden;
}

button {
  font-family: inherit;
}


/* ========================================
   最上方
======================================== */

.topbar {

  height: 64px;

  background: #171717;

  border-bottom:
    1px solid var(--line);

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  padding:
    0 18px;
}


.brand {

  font-size: 20px;

  font-weight: bold;
}


.top-actions {

  display: flex;

  gap: 8px;
}


.top-button {

  border: none;

  border-radius: 9px;

  background: #303030;

  color: white;

  padding:
    10px 14px;

  cursor: pointer;
}


.finish-button {

  background:
    var(--pink);

  font-weight: bold;
}


/* ========================================
   主畫面
======================================== */

.editor {

  height:
    calc(100vh - 64px);

  display: flex;

  flex-direction: column;

  min-height: 0;
}


/* ========================================
   預覽區
======================================== */

.preview {

  flex: 1;

  min-height: 90px;

  background: #0c0c0c;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #888;

  text-align: center;
}


.preview-icon {

  font-size: 34px;

  margin-bottom: 7px;
}


/* ========================================
   播放控制
======================================== */

.playbar {

  height: 54px;

  flex-shrink: 0;

  background: #171717;

  border-top:
    1px solid #2a2a2a;

  border-bottom:
    1px solid #2a2a2a;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 22px;
}


.round-button {

  width: 38px;

  height: 38px;

  border-radius: 50%;

  border: none;

  background: #343434;

  color: white;

  cursor: pointer;

  font-size: 16px;
}


.play-button {

  background: white;

  color: black;
}


.time-text {

  color: #bbb;

  font-size: 13px;
}


/* ========================================
   時間軸
======================================== */

.timeline {

  height: 230px;

  flex-shrink: 0;

  background: #202020;

  position: relative;

  overflow: hidden;
}


/* 時間刻度 */

.ruler {

  height: 36px;

  padding-left: 30px;

  display: flex;

  align-items: center;

  color: #999;

  font-size: 12px;

  white-space: nowrap;

  border-bottom:
    1px solid #303030;
}


.ruler span {

  width: 100px;

  flex-shrink: 0;
}


/* 時間軸捲動區 */

.timeline-scroll {

  height: 194px;

  overflow-x: auto;

  overflow-y: hidden;

  padding:
    28px 26px;
}


.track {

  min-width: 1200px;

  height: 88px;

  display: flex;

  align-items: center;

  gap: 6px;

  position: relative;
}


.empty-track {

  color: #777;

  font-size: 14px;

  padding-left: 18px;
}


/* ========================================
   時間軸片段
======================================== */

.clip {

  width: 190px;

  height: 66px;

  flex-shrink: 0;

  border-radius: 8px;

  border:
    2px solid transparent;

  padding: 8px;

  cursor: pointer;

  overflow: hidden;

  position: relative;
}


/* 音樂 */

.clip.music {

  background:
    repeating-linear-gradient(
      to right,

      #08a9b7 0px,

      #08a9b7 8px,

      #077984 9px,

      #077984 13px
    );
}


/* 拼接 */

.clip.splice {

  background:
    repeating-linear-gradient(
      to right,

      #7655e8 0px,

      #7655e8 8px,

      #553ca7 9px,

      #553ca7 13px
    );
}


/* 音效 */

.clip.effect {

  background:
    repeating-linear-gradient(
      to right,

      #d78b18 0px,

      #d78b18 8px,

      #a86b10 9px,

      #a86b10 13px
    );
}


/* 選取中的片段 */

.clip.selected {

  border-color: white;

  box-shadow:
    0 0 0 2px
    var(--pink);
}


.clip-title {

  font-size: 13px;

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.clip-info {

  font-size: 11px;

  margin-top: 9px;

  opacity: 0.92;
}


/* ========================================
   中央白色播放頭
======================================== */

.playhead {

  position: absolute;

  top: 36px;

  bottom: 0;

  left: 50%;

  width: 3px;

  background: white;

  z-index: 20;

  pointer-events: none;
}


.playhead::before {

  content: "";

  position: absolute;

  top: -6px;

  left: -5px;

  width: 13px;

  height: 13px;

  border-radius: 50%;

  background: white;
}


/* ========================================
   唯一一組素材入口
======================================== */

.material-buttons {

  height: 70px;

  flex-shrink: 0;

  background: #181818;

  border-top:
    1px solid #333;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;
}


.material-button {

  min-width: 125px;

  border: none;

  border-radius: 10px;

  background: #2b2b2b;

  color: white;

  padding:
    13px 18px;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}


.material-button.active {

  background:
    #503ab2;
}


/* ========================================
   編輯工具提示
======================================== */

.edit-help {

  height: 28px;

  flex-shrink: 0;

  background: #252525;

  text-align: center;

  color: #bbb;

  font-size: 12px;

  padding-top: 7px;
}


/* ========================================
   兒童友善編輯工具
======================================== */

.edit-tools {

  height: 110px;

  flex-shrink: 0;

  background: #252525;

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding:
    8px 10px 14px;
}


.edit-button {

  min-width: 108px;

  border: none;

  border-radius: 10px;

  background: #343434;

  color: white;

  padding: 8px;

  cursor: pointer;
}


.edit-button:disabled {

  opacity: 0.28;

  cursor: default;
}


.edit-icon {

  display: block;

  font-size: 24px;
}


.edit-name {

  display: block;

  margin-top: 5px;

  font-size: 14px;

  font-weight: bold;
}


.edit-desc {

  display: block;

  margin-top: 4px;

  color: #bbb;

  font-size: 10px;
}


/* ========================================
   素材彈出面板
======================================== */

.material-sheet {

  position: fixed;

  left: 0;

  right: 0;

  bottom: 208px;

  height: 46vh;

  background: #202020;

  border-top:
    1px solid #444;

  box-shadow:
    0 -12px 30px
    rgba(0,0,0,0.35);

  z-index: 100;

  display: none;

  flex-direction: column;
}


.material-sheet.show {

  display: flex;
}


.sheet-header {

  height: 56px;

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  padding:
    0 16px;

  border-bottom:
    1px solid #393939;
}


.sheet-title {

  font-size: 18px;

  font-weight: bold;
}


.close-button {

  width: 36px;

  height: 36px;

  border: none;

  border-radius: 50%;

  background: #333;

  color: white;

  font-size: 20px;

  cursor: pointer;
}


/* ========================================
   搜尋＋上傳
======================================== */

.sheet-tools {

  padding:
    10px 14px 0;

  display: flex;

  gap: 8px;
}


.search-box {

  flex: 1;

  border: none;

  outline: none;

  border-radius: 8px;

  background: #303030;

  color: white;

  padding:
    10px 12px;

  font-size: 14px;
}


.upload-own {

  display: none;

  border: none;

  border-radius: 8px;

  background: #3a3a3a;

  color: white;

  padding:
    10px 12px;

  cursor: pointer;

  white-space: nowrap;
}


#uploadInput {

  display: none;
}


/* ========================================
   素材列表
======================================== */

.material-list {

  flex: 1;

  overflow-y: auto;

  padding:
    10px 14px 20px;
}


.material-row {

  min-height: 68px;

  background: #2b2b2b;

  border-radius: 10px;

  margin-bottom: 8px;

  padding: 10px;

  display: flex;

  align-items: center;

  gap: 10px;
}


.mark-button {

  width: 42px;

  border: none;

  background: transparent;

  color: white;

  font-size: 22px;

  cursor: pointer;
}


.material-info {

  flex: 1;

  min-width: 0;
}


.material-name {

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.material-small {

  font-size: 11px;

  color: #aaa;

  margin-top: 5px;
}


.use-button {

  border: none;

  border-radius: 8px;

  background:
    var(--pink);

  color: white;

  padding:
    9px 15px;

  font-weight: bold;

  cursor: pointer;
}


/* ========================================
   小提示
======================================== */

.toast {

  position: fixed;

  left: 50%;

  bottom: 224px;

  transform:
    translateX(-50%);

  background:
    rgba(0,0,0,0.9);

  color: white;

  padding:
    11px 20px;

  border-radius: 22px;

  z-index: 999;

  display: none;

  font-size: 14px;
}


/* ========================================
   手機
======================================== */

@media (max-width: 700px) {

  .brand {

    font-size: 16px;
  }

  .top-button {

    padding: 8px;

    font-size: 12px;
  }

  .material-button {

    min-width: 96px;

    padding:
      11px 8px;
  }

  .timeline {

    height: 220px;
  }

}

</style>

</head>


<body>


<!-- ========================================
     最上方
======================================== -->

<header class="topbar">

  <div class="brand">

    🥋 自由品勢剪輯器

  </div>


  <div class="top-actions">

    <button
      class="top-button"
      onclick="showToast('📝 草稿功能下一步接上')"
    >
      📝 草稿
    </button>


    <button
      class="top-button"
      onclick="showToast('🎵 我的成品功能下一步接上')"
    >
      🎵 我的成品
    </button>


    <button
      class="top-button finish-button"
      onclick="showToast('✅ 完成輸出功能下一步接上')"
    >
      完成
    </button>

  </div>

</header>


<main class="editor">


<!-- ========================================
     預覽
======================================== -->

<section class="preview">

  <div>

    <div class="preview-icon">

      🎧

    </div>

    <div>

      自由品勢音樂剪輯

    </div>

    <small>

      點下面的「音樂、拼接、音效」開始製作

    </small>

  </div>

</section>


<!-- ========================================
     播放
======================================== -->

<div class="playbar">

  <button
    class="round-button"
    onclick="undo()"
  >
    ↶
  </button>


  <button
    class="round-button play-button"
    onclick="showToast('▶️ 播放功能下一步接真正音訊')"
  >
    ▶
  </button>


  <div class="time-text">

    00:00 / 01:35

  </div>


  <button
    class="round-button"
    onclick="redo()"
  >
    ↷
  </button>

</div>


<!-- ========================================
     時間軸
======================================== -->

<section class="timeline">


  <div class="ruler">

    <span>00:00</span>

    <span>00:10</span>

    <span>00:20</span>

    <span>00:30</span>

    <span>00:40</span>

    <span>00:50</span>

    <span>01:00</span>

    <span>01:10</span>

    <span>01:20</span>

    <span>01:30</span>

  </div>


  <div class="playhead"></div>


  <div class="timeline-scroll">

    <div
      id="track"
      class="track"
    ></div>

  </div>


</section>


<!-- ========================================
     唯一一組素材入口
======================================== -->

<div class="material-buttons">


  <button
    class="material-button"
    onclick="openMaterials('music', this)"
  >
    🎵 音樂
  </button>


  <button
    class="material-button"
    onclick="openMaterials('splice', this)"
  >
    ✂️ 拼接
  </button>


  <button
    class="material-button"
    onclick="openMaterials('effect', this)"
  >
    🔊 音效
  </button>


</div>


<!-- ========================================
     編輯提示
======================================== -->

<div
  id="editHelp"
  class="edit-help"
>

  請先點選時間軸上的一段音樂

</div>


<!-- ========================================
     編輯工具
======================================== -->

<div class="edit-tools">


  <button
    class="edit-button edit-action"
    onclick="splitClip()"
    disabled
  >

    <span class="edit-icon">
      ✂️
    </span>

    <span class="edit-name">
      分割
    </span>

    <span class="edit-desc">
      從這裡切開
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="deleteClip()"
    disabled
  >

    <span class="edit-icon">
      🗑️
    </span>

    <span class="edit-name">
      刪除
    </span>

    <span class="edit-desc">
      移除這一段
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="changeVolume()"
    disabled
  >

    <span class="edit-icon">
      🔊
    </span>

    <span class="edit-name">
      音量
    </span>

    <span class="edit-desc">
      調大／調小
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="toggleFade()"
    disabled
  >

    <span class="edit-icon">
      ◐
    </span>

    <span class="edit-name">
      淡入淡出
    </span>

    <span class="edit-desc">
      慢慢進／慢慢退
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="duplicateClip()"
    disabled
  >

    <span class="edit-icon">
      ⧉
    </span>

    <span class="edit-name">
      複製
    </span>

    <span class="edit-desc">
      再做一段
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="changeSpeed()"
    disabled
  >

    <span class="edit-icon">
      ⏱️
    </span>

    <span class="edit-name">
      變速
    </span>

    <span class="edit-desc">
      加快／放慢
    </span>

  </button>


  <button
    class="edit-button edit-action"
    onclick="toggleMute()"
    disabled
  >

    <span class="edit-icon">
      🔇
    </span>

    <span class="edit-name">
      靜音
    </span>

    <span class="edit-desc">
      這段不出聲
    </span>

  </button>


</div>


</main>


<!-- ========================================
     素材彈出面板
======================================== -->

<section
  id="materialSheet"
  class="material-sheet"
>


  <div class="sheet-header">


    <div
      id="sheetTitle"
      class="sheet-title"
    >
      🎵 音樂
    </div>


    <button
      class="close-button"
      onclick="closeMaterials()"
    >
      ×
    </button>


  </div>


  <div class="sheet-tools">


    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="搜尋素材"
      oninput="renderMaterials(currentMaterialType)"
    >


    <label
      id="uploadButton"
      class="upload-own"
      for="uploadInput"
    >
      ⬆️ 上傳
    </label>


    <input
      id="uploadInput"
      type="file"
      accept="audio/*"
      multiple
    >


  </div>


  <div
    id="materialList"
    class="material-list"
  ></div>


</section>


<div
  id="toast"
  class="toast"
></div>


<script>


/* ========================================
   測試素材
   之後再正式連接素材庫
======================================== */

const materials = {


  music: [

    {
      id: "music01",
      title: "音樂 01"
    },

    {
      id: "music02",
      title: "音樂 02"
    },

    {
      id: "music03",
      title: "音樂 03"
    },

    {
      id: "music04",
      title: "音樂 04"
    }

  ],


  splice: [

    {
      id: "splice01",
      title: "拼接 01"
    },

    {
      id: "splice02",
      title: "拼接 02"
    },

    {
      id: "splice03",
      title: "拼接 03"
    }

  ],


  effect: [

    {
      id: "effect01",
      title: "音效 01"
    },

    {
      id: "effect02",
      title: "音效 02"
    },

    {
      id: "effect03",
      title: "音效 03"
    }

  ]


};


/* ========================================
   自己上傳的音樂
======================================== */

const uploadedMusic = [];


document
  .getElementById(
    "uploadInput"
  )
  .addEventListener(
    "change",
    function (event) {


      const files =
        Array.from(
          event.target.files
        );


      files.forEach(
        function (file) {


          uploadedMusic.push({

            id:
              "upload_" +
              Date.now() +
              "_" +
              Math.random(),

            title:
              file.name,

            file:
              URL.createObjectURL(
                file
              )

          });


        }
      );


      renderMaterials(
        "music"
      );


      showToast(
        "✅ 已加入音樂清單"
      );


    }
  );


/* ========================================
   喜歡／標記
======================================== */

function isMarked(id) {


  return (

    localStorage.getItem(
      "favorite_" + id
    ) === "true"

  );


}


function toggleMark(
  id,
  type
) {


  const next =
    !isMarked(id);


  localStorage.setItem(

    "favorite_" + id,

    next
      ? "true"
      : "false"

  );


  renderMaterials(type);


}


/* ========================================
   開啟素材
======================================== */

let currentMaterialType =
  "music";


function openMaterials(
  type,
  button
) {


  currentMaterialType =
    type;


  document
    .querySelectorAll(
      ".material-button"
    )
    .forEach(
      function (btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


  button.classList.add(
    "active"
  );


  const titles = {

    music:
      "🎵 音樂",

    splice:
      "✂️ 拼接",

    effect:
      "🔊 音效"

  };


  document
    .getElementById(
      "sheetTitle"
    )
    .textContent =
      titles[type];


  document
    .getElementById(
      "uploadButton"
    )
    .style.display =

      type === "music"
        ? "inline-block"
        : "none";


  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  renderMaterials(type);


  document
    .getElementById(
      "materialSheet"
    )
    .classList.add(
      "show"
    );


}


/* ========================================
   關閉素材
======================================== */

function closeMaterials() {


  document
    .getElementById(
      "materialSheet"
    )
    .classList.remove(
      "show"
    );


  document
    .querySelectorAll(
      ".material-button"
    )
    .forEach(
      function (btn) {

        btn.classList.remove(
          "active"
        );

      }
    );


}


/* ========================================
   顯示素材
   標記過的自動排前面
======================================== */

function renderMaterials(type) {


  const list =
    document.getElementById(
      "materialList"
    );


  let data = [
    ...materials[type]
  ];


  if (
    type === "music"
  ) {


    data = [

      ...uploadedMusic,

      ...data

    ];


  }


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if (keyword) {


    data =
      data.filter(
        function (item) {

          return item
            .title
            .toLowerCase()
            .includes(
              keyword
            );

        }
      );


  }


  data.sort(
    function (a, b) {


      return (

        Number(
          isMarked(b.id)
        )

        -

        Number(
          isMarked(a.id)
        )

      );


    }
  );


  list.innerHTML =
    "";


  data.forEach(
    function (item) {


      const marked =
        isMarked(
          item.id
        );


      let symbol =
        "";


      let color =
        "white";


      if (
        type === "music"
      ) {


        symbol =
          marked
            ? "♥"
            : "♡";


        if (marked) {

          color =
            "#ff4d6d";

        }


      }


      if (
        type === "splice"
      ) {


        symbol =
          "✂";


        if (marked) {

          color =
            "#a855f7";

        }


      }


      if (
        type === "effect"
      ) {


        symbol =
          marked
            ? "★"
            : "☆";


        if (marked) {

          color =
            "#ffd54a";

        }


      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "material-row";


      row.innerHTML = `

        <button
          class="mark-button"
          style="color:${color}"
        >
          ${symbol}
        </button>


        <div class="material-info">

          <div class="material-name">
            ${item.title}
          </div>

          <div class="material-small">

            ${
              marked
                ? "已標記・優先顯示"
                : "按「使用」加入時間軸"
            }

          </div>

        </div>


        <button class="use-button">

          使用

        </button>

      `;


      row
        .querySelector(
          ".mark-button"
        )
        .onclick =
          function () {


            toggleMark(
              item.id,
              type
            );


          };


      row
        .querySelector(
          ".use-button"
        )
        .onclick =
          function () {


            addToTimeline(
              item,
              type
            );


          };


      list.appendChild(
        row
      );


    }
  );


}


/* ========================================
   時間軸資料
======================================== */

let clips =
  [];


let selectedId =
  null;


let undoStack =
  [];


let redoStack =
  [];


/* ========================================
   保存復原紀錄
======================================== */

function saveHistory() {


  undoStack.push(

    JSON.stringify(
      clips
    )

  );


  if (
    undoStack.length >
    30
  ) {


    undoStack.shift();


  }


  redoStack =
    [];


}


/* ========================================
   加入時間軸
======================================== */

function addToTimeline(
  item,
  type
) {


  saveHistory();


  clips.push({


    uid:

      Date.now() +
      "_" +
      Math.random(),


    title:
      item.title,


    type:
      type,


    muted:
      false,


    volume:
      100,


    speed:
      1,


    fade:
      false


  });


  renderTimeline();


  showToast(
    "✅ 已加入時間軸"
  );


}


/* ========================================
   顯示時間軸
======================================== */

function renderTimeline() {


  const track =
    document.getElementById(
      "track"
    );


  track.innerHTML =
    "";


  if (
    clips.length ===
    0
  ) {


    track.innerHTML = `

      <div class="empty-track">

        點「音樂、拼接或音效」
        再按「使用」

      </div>

    `;


    selectedId =
      null;


    updateEditTools();


    return;


  }


  clips.forEach(
    function (clip) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "clip " +
        clip.type;


      if (
        clip.uid ===
        selectedId
      ) {


        div.classList.add(
          "selected"
        );


      }


      div.innerHTML = `

        <div class="clip-title">

          ${clip.title}

        </div>


        <div class="clip-info">

          ${
            clip.muted
              ? "🔇"
              : "🔊"
          }

          ${clip.volume}%

          ・

          ${clip.speed}x

          ${
            clip.fade
              ? "・淡入淡出"
              : ""
          }

        </div>

      `;


      div.onclick =
        function () {


          selectedId =
            clip.uid;


          renderTimeline();


        };


      track.appendChild(
        div
      );


    }
  );


  updateEditTools();


}


/* ========================================
   啟用／停用工具
======================================== */

function updateEditTools() {


  const selected =
    clips.find(
      function (clip) {

        return (
          clip.uid ===
          selectedId
        );

      }
    );


  document
    .querySelectorAll(
      ".edit-action"
    )
    .forEach(
      function (button) {


        button.disabled =
          !selected;


      }
    );


  document
    .getElementById(
      "editHelp"
    )
    .textContent =

      selected

      ? "目前選擇：" +
        selected.title

      : "請先點選時間軸上的一段音樂";


}


/* ========================================
   找選取中的片段
======================================== */

function getSelectedIndex() {


  return clips.findIndex(
    function (clip) {


      return (
        clip.uid ===
        selectedId
      );


    }
  );


}


/* ========================================
   分割
======================================== */

function splitClip() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  const original =
    clips[index];


  const baseTitle =
    original.title
      .replace(
        "・前半",
        ""
      );


  clips[index] = {

    ...original,

    title:
      baseTitle +
      "・前半"

  };


  clips.splice(

    index + 1,

    0,

    {

      ...original,

      uid:
        Date.now() +
        "_" +
        Math.random(),

      title:
        baseTitle +
        "・後半"

    }

  );


  renderTimeline();


  showToast(
    "✂️ 已分割成兩段"
  );


}


/* ========================================
   刪除
======================================== */

function deleteClip() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  clips.splice(
    index,
    1
  );


  selectedId =
    null;


  renderTimeline();


  showToast(
    "🗑️ 已刪除"
  );


}


/* ========================================
   音量
======================================== */

function changeVolume() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  const values = [

    100,

    75,

    50,

    25

  ];


  const current =
    clips[index]
      .volume;


  let next =
    values
      .indexOf(
        current
      )
    + 1;


  if (
    next >=
    values.length
  ) {


    next =
      0;


  }


  clips[index]
    .volume =
      values[next];


  renderTimeline();


  showToast(

    "🔊 音量：" +

    clips[index]
      .volume +

    "%"

  );


}


/* ========================================
   淡入淡出
======================================== */

function toggleFade() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  clips[index]
    .fade =

      !clips[index]
        .fade;


  renderTimeline();


  showToast(

    clips[index]
      .fade

      ? "◐ 已開啟淡入淡出"

      : "◐ 已關閉淡入淡出"

  );


}


/* ========================================
   複製
======================================== */

function duplicateClip() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  clips.splice(

    index + 1,

    0,

    {

      ...clips[index],

      uid:
        Date.now() +
        "_" +
        Math.random(),

      title:
        clips[index]
          .title +
        "・複製"

    }

  );


  renderTimeline();


  showToast(
    "⧉ 已複製一段"
  );


}


/* ========================================
   變速
======================================== */

function changeSpeed() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  const speeds = [

    1,

    1.25,

    1.5,

    0.75

  ];


  let next =

    speeds.indexOf(
      clips[index]
        .speed
    )

    + 1;


  if (
    next >=
    speeds.length
  ) {


    next =
      0;


  }


  clips[index]
    .speed =
      speeds[next];


  renderTimeline();


  showToast(

    "⏱️ 速度：" +

    clips[index]
      .speed +

    "x"

  );


}


/* ========================================
   靜音
======================================== */

function toggleMute() {


  const index =
    getSelectedIndex();


  if (
    index < 0
  ) {

    return;

  }


  saveHistory();


  clips[index]
    .muted =

      !clips[index]
        .muted;


  renderTimeline();


  showToast(

    clips[index]
      .muted

      ? "🔇 這一段已靜音"

      : "🔊 已恢復聲音"

  );


}


/* ========================================
   復原
======================================== */

function undo() {


  if (
    undoStack.length ===
    0
  ) {


    showToast(
      "目前沒有可以復原的動作"
    );


    return;


  }


  redoStack.push(

    JSON.stringify(
      clips
    )

  );


  clips =

    JSON.parse(
      undoStack.pop()
    );


  selectedId =
    null;


  renderTimeline();


  showToast(
    "↶ 已復原"
  );


}


/* ========================================
   重做
======================================== */

function redo() {


  if (
    redoStack.length ===
    0
  ) {


    showToast(
      "目前沒有可以重做的動作"
    );


    return;


  }


  undoStack.push(

    JSON.stringify(
      clips
    )

  );


  clips =

    JSON.parse(
      redoStack.pop()
    );


  selectedId =
    null;


  renderTimeline();


  showToast(
    "↷ 已重做"
  );


}


/* ========================================
   提示訊息
======================================== */

let toastTimer;


function showToast(text) {


  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.style.display =
    "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =

    setTimeout(
      function () {


        toast.style.display =
          "none";


      },

      1700

    );


}


/* ========================================
   初始畫面
======================================== */

renderTimeline();


</script>
