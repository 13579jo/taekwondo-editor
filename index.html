<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自由品勢音樂剪輯器</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#0f1014;
  --panel:#181a20;
  --panel2:#22252d;
  --line:#363944;
  --text:#fff;
  --sub:#a9adba;
  --pink:#ff356b;
  --music:#078b98;
  --splice:#6d50cf;
  --effect:#c47a16;
  --beat:#ffd447;
  --danger:#ff3b45;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   01｜最上方功能列
   ========================================================= */

.top-shell{
  background:#17191f;
  border-bottom:1px solid var(--line);
}

.main-top-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 12px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
}

.main-top-row .top-btn{
  flex:0 0 auto;
}

.top-btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#30333d;
  color:#fff;
  font-weight:800;
}

.finish-btn{
  background:var(--pink);
}


/* =========================================================
   02｜標題
   ========================================================= */

.editor-title{
  padding:17px 12px;
  text-align:center;
  background:#0b0c10;
  border-bottom:1px solid #292b33;
}

.editor-title .icon{
  font-size:28px;
}

.editor-title h1{
  font-size:20px;
  margin:4px 0;
}

.editor-title p{
  margin:0;
  color:#858a98;
  font-size:12px;
}


/* =========================================================
   03｜時間軸
   ========================================================= */

.timeline-shell{
  position:relative;
  height:390px;
  background:#17191e;
  border-bottom:1px solid var(--line);
  overflow:hidden;
}

.timeline-scroll{
  position:relative;
  width:100%;
  height:100%;
  overflow:auto;
}

.timeline-content{
  position:relative;
  min-width:100%;
  min-height:100%;
}

.ruler{
  position:absolute;
  top:0;
  left:0;
  height:42px;
  width:100%;
  background:#191b21;
  border-bottom:1px solid #333640;
  z-index:4;
}

.ruler-mark{
  position:absolute;
  top:0;
  height:42px;
  border-left:1px solid #454954;
  color:#aeb2bd;
  font-size:11px;
  padding:6px 0 0 5px;
  white-space:nowrap;
}

.tracks-bg{
  position:absolute;
  left:0;
  top:42px;
  right:0;
}

.track-row{
  position:absolute;
  left:0;
  right:0;
  height:72px;
  border-bottom:1px solid #292c34;
  background:rgba(255,255,255,.012);
}

.clips-layer{
  position:absolute;
  inset:0;
  z-index:8;
}

.beats-layer{
  position:absolute;
  left:0;
  top:42px;
  right:0;
  bottom:0;
  z-index:6;
  pointer-events:none;
}

.beat-line{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:rgba(255,212,71,.7);
}

.beat-line::before{
  content:"🚩";
  position:absolute;
  top:1px;
  left:-8px;
  font-size:13px;
}


/* =========================================================
   04｜中央播放線
   ========================================================= */

.playhead{
  position:absolute;
  left:50%;
  top:42px;
  bottom:0;
  width:3px;
  background:#fff;
  z-index:40;
  pointer-events:none;
  box-shadow:0 0 4px #000;
}

.playhead::before{
  content:"";
  position:absolute;
  top:-6px;
  left:-5px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
}


/* =========================================================
   05｜沒有素材
   ========================================================= */

.empty-timeline{
  position:absolute;
  left:0;
  right:0;
  top:120px;
  text-align:center;
  color:#777d8b;
  font-size:14px;
  line-height:1.8;
  z-index:2;
}


/* =========================================================
   06｜音訊片段
   ========================================================= */

.clip{
  position:absolute;
  height:60px;
  min-width:34px;
  border:2px solid transparent;
  border-radius:8px;
  overflow:hidden;
  user-select:none;
  touch-action:none;
  cursor:grab;
}

.clip.music{
  background:var(--music);
}

.clip.splice{
  background:var(--splice);
}

.clip.effect{
  background:var(--effect);
}

.clip.selected{
  border-color:#fff;
  box-shadow:0 0 0 2px var(--pink);
}

.clip.dragging{
  opacity:.88;
  cursor:grabbing;
  z-index:30;
}

.clip-title{
  position:absolute;
  left:17px;
  right:17px;
  top:4px;
  z-index:5;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 2px #000;
}


/* =========================================================
   07｜真正高低波形
   ========================================================= */

.wave-canvas{
  position:absolute;
  left:13px;
  right:13px;
  top:21px;
  width:calc(100% - 26px);
  height:34px;
  pointer-events:none;
}


/* =========================================================
   08｜左右裁切把手
   ========================================================= */

.trim-handle{
  position:absolute;
  top:0;
  bottom:0;
  width:12px;
  background:#fff;
  z-index:12;
  cursor:ew-resize;
  touch-action:none;
}

.trim-handle.left{
  left:0;
  border-radius:6px 0 0 6px;
}

.trim-handle.right{
  right:0;
  border-radius:0 6px 6px 0;
}

.trim-handle::after{
  content:"";
  position:absolute;
  top:22px;
  left:4px;
  width:4px;
  height:16px;
  border-radius:4px;
  background:#aaa;
}


/* =========================================================
   09｜靜音紅色 X
   ========================================================= */

.mute-mark{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  color:var(--danger);
  font-size:36px;
  font-weight:900;
  text-shadow:0 2px 4px #000;
  z-index:10;
  pointer-events:none;
}

.clip.muted .mute-mark{
  display:flex;
}


/* =========================================================
   10｜素材入口
   ========================================================= */

.material-bar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px 12px;
  background:#181a20;
  border-bottom:1px solid var(--line);
}

.material-btn{
  min-width:120px;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#2b2e37;
  color:#fff;
  font-weight:800;
  font-size:15px;
}

.select-tip{
  text-align:center;
  padding:7px;
  background:#22242b;
  color:#afb3bf;
  font-size:12px;
}


/* =========================================================
   11｜工具列
   ========================================================= */

.tool-area{
  padding:11px 12px 14px;
  background:#22242b;
}

.tool-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.tool-btn{
  min-width:101px;
  border:0;
  border-radius:10px;
  padding:8px 9px;
  background:#333640;
  color:#fff;
}

.tool-btn:disabled{
  opacity:.28;
  cursor:default;
}

.tool-icon{
  display:block;
  font-size:20px;
}

.tool-name{
  display:block;
  margin-top:3px;
  font-size:13px;
  font-weight:800;
}

.tool-desc{
  display:block;
  margin-top:2px;
  color:#aaa;
  font-size:10px;
}


/* =========================================================
   12｜彈出視窗
   ========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(820px,96vw);
  max-height:88vh;
  overflow:auto;
  background:#20232a;
  border:1px solid #424650;
  border-radius:14px;
}

.modal-head{
  position:sticky;
  top:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 15px;
  background:#20232a;
  border-bottom:1px solid #3a3e48;
}

.modal-title{
  font-size:18px;
  font-weight:900;
}

.modal-close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#343842;
  color:#fff;
  font-size:20px;
}

.modal-body{
  padding:13px 15px 18px;
}


/* =========================================================
   13｜素材面板
   ========================================================= */

.material-note,
.storage-note{
  font-size:12px;
  color:#9da2ae;
  line-height:1.6;
  margin-bottom:12px;
}

.material-list{
  display:grid;
  gap:9px;
}

.material-card{
  display:grid;
  grid-template-columns:
    minmax(160px,1fr)
    minmax(180px,320px)
    auto
    auto;
  gap:9px;
  align-items:center;
  padding:10px;
  border-radius:10px;
  background:#2a2d35;
}

.material-name{
  font-weight:800;
  word-break:break-word;
}

.material-sub{
  font-size:11px;
  color:#a9adba;
  margin-top:3px;
}

.material-card audio{
  width:100%;
  height:36px;
}

.mark-btn,
.use-btn,
.row-btn{
  border:0;
  border-radius:8px;
  padding:9px 11px;
  background:#3a3e48;
  color:#fff;
  font-weight:800;
}

.use-btn{
  background:var(--pink);
}

.mark-btn.music.on{
  color:#ff587d;
}

.mark-btn.splice.on{
  color:#b69cff;
}

.mark-btn.effect.on{
  color:#ffd447;
}


/* =========================================================
   14｜草稿 / 成品列表
   ========================================================= */

.list-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  padding:11px;
  margin-bottom:9px;
  border-radius:10px;
  background:#2a2d35;
}

.list-info{
  flex:1;
  min-width:190px;
}

.list-name{
  font-weight:900;
}

.list-meta{
  font-size:11px;
  color:#a9adba;
  margin-top:4px;
}

.list-row audio{
  width:100%;
  margin-top:7px;
}


/* =========================================================
   15｜設定
   ========================================================= */

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  color:#c9ccd4;
  font-size:13px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #454a56;
  background:#15171c;
  color:#fff;
}

.primary-btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:var(--pink);
  color:#fff;
  font-weight:900;
}


/* =========================================================
   16｜提示
   ========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:9999;
  display:none;
  padding:11px 17px;
  border-radius:22px;
  background:rgba(0,0,0,.93);
  color:#fff;
  font-size:14px;
}


/* =========================================================
   17｜手機
   ========================================================= */

@media(max-width:700px){

  .main-top-row{
    justify-content:flex-start;
    padding:9px 8px;
  }

  .main-top-row .top-btn{
    padding:9px 10px;
    font-size:12px;
  }

  .timeline-shell{
    height:360px;
  }

  .material-btn{
    min-width:95px;
    padding:11px 8px;
  }

  .tool-btn{
    min-width:90px;
  }

  .material-card{
    grid-template-columns:1fr auto;
  }

  .material-card audio{
    grid-column:1/-1;
  }

  .material-card .use-btn{
    grid-column:2;
  }

  .editor-title{
    padding:13px 8px;
  }

}

</style>
</head>

<body>


<!-- =========================================================
     最上方功能列
     ========================================================= -->

<div class="top-shell">

  <div class="main-top-row">

    <button
      id="backBtn"
      class="top-btn"
    >
      ← 回音樂素材
    </button>

    <button
      id="uploadBtn"
      class="top-btn"
    >
      ⬆️ 上傳音樂
    </button>

    <button
      id="draftsBtn"
      class="top-btn"
    >
      📝 草稿
    </button>

    <button
      id="productsBtn"
      class="top-btn"
    >
      🎵 成品
    </button>

    <button
      id="finishBtn"
      class="top-btn finish-btn"
    >
      ✅ 完成
    </button>

  </div>

</div>


<!-- 只有上傳音樂會從手機 / 電腦找檔案 -->

<input
  id="uploadInput"
  type="file"
  accept="audio/*"
  multiple
  hidden
>


<!-- =========================================================
     標題
     ========================================================= -->

<section class="editor-title">

  <div class="icon">
    🎧
  </div>

  <h1>
    自由品勢音樂剪輯
  </h1>

  <p>
    真實波形｜動態多軌｜自由拖曳｜左右裁切
  </p>

</section>


<!-- =========================================================
     時間軸
     ========================================================= -->

<section
  class="timeline-shell"
  id="timelineShell"
>

  <div
    id="timelineScroll"
    class="timeline-scroll"
  >

    <div
      id="timelineContent"
      class="timeline-content"
    >

      <div
        id="ruler"
        class="ruler"
      ></div>

      <div
        id="tracksBg"
        class="tracks-bg"
      ></div>

      <div
        id="beatsLayer"
        class="beats-layer"
      ></div>

      <div
        id="clipsLayer"
        class="clips-layer"
      ></div>

      <div
        id="emptyTimeline"
        class="empty-timeline"
      >

        還沒有素材
        <br>

        按「🎵 音樂／✂️ 拼接／🔊 音效」
        從我們的素材庫加入

        <br>

        或用「⬆️ 上傳音樂」
        加入自己的音樂

      </div>

    </div>

  </div>

  <div class="playhead"></div>

</section>


<!-- =========================================================
     我們自己的素材庫
     ========================================================= -->

<section class="material-bar">

  <button
    class="material-btn"
    data-type="music"
  >
    🎵 音樂
  </button>

  <button
    class="material-btn"
    data-type="splice"
  >
    ✂️ 拼接
  </button>

  <button
    class="material-btn"
    data-type="effect"
  >
    🔊 音效
  </button>

</section>


<div
  id="selectTip"
  class="select-tip"
>
  請先點選時間軸上的一段素材
</div>


<!-- =========================================================
     工具
     ========================================================= -->

<section class="tool-area">

  <div class="tool-row">

    <button
      id="playBtn"
      class="tool-btn"
    >
      <span class="tool-icon">▶</span>
      <span class="tool-name">播放</span>
      <span class="tool-desc">播放剪輯內容</span>
    </button>

    <button
      id="undoBtn"
      class="tool-btn"
    >
      <span class="tool-icon">↶</span>
      <span class="tool-name">回上一步</span>
      <span class="tool-desc">回到前一個動作</span>
    </button>

    <button
      id="redoBtn"
      class="tool-btn"
    >
      <span class="tool-icon">↷</span>
      <span class="tool-name">重做</span>
      <span class="tool-desc">回復剛才動作</span>
    </button>

    <button
      id="beatBtn"
      class="tool-btn"
    >
      <span class="tool-icon">🚩</span>
      <span class="tool-name">節拍</span>
      <span class="tool-desc">播放線加標記</span>
    </button>

    <button
      id="splitBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">✂️</span>
      <span class="tool-name">分割</span>
      <span class="tool-desc">從播放線切開</span>
    </button>

    <button
      id="deleteBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">🗑️</span>
      <span class="tool-name">刪除</span>
      <span class="tool-desc">刪除選取片段</span>
    </button>

    <button
      id="volumeBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">🔊</span>
      <span class="tool-name">音量</span>
      <span class="tool-desc">個別調整音量</span>
    </button>

    <button
      id="fadeBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">◐</span>
      <span class="tool-name">淡入淡出</span>
      <span class="tool-desc">設定進退時間</span>
    </button>

    <button
      id="copyBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">⧉</span>
      <span class="tool-name">複製</span>
      <span class="tool-desc">複製這一段</span>
    </button>

    <button
      id="speedBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">⏱️</span>
      <span class="tool-name">變速</span>
      <span class="tool-desc">加快或放慢</span>
    </button>

    <button
      id="muteBtn"
      class="tool-btn need-clip"
      disabled
    >
      <span class="tool-icon">🔇</span>
      <span class="tool-name">靜音</span>
      <span class="tool-desc">這一段不出聲</span>
    </button>

  </div>

</section>


<!-- =========================================================
     彈出視窗
     ========================================================= -->

<div
  id="modalBackdrop"
  class="modal-backdrop"
>

  <div class="modal">

    <div class="modal-head">

      <div
        id="modalTitle"
        class="modal-title"
      ></div>

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   01｜固定設定
   ========================================================= */

const LIBRARY_BASE =
  "https://13579jo.github.io/taekwondo-music-library/";

const PPS = 16;
const RULER_H = 42;
const TRACK_H = 72;
const MIN_CLIP = 0.20;
const DEFAULT_DURATION = 100;

const AudioContextClass =
  window.AudioContext ||
  window.webkitAudioContext;

const audioContext =
  new AudioContextClass();


/* =========================================================
   02｜我們自己的素材庫
   ========================================================= */

const MATERIALS = {

  music:

    [1,2,3,4]

    .map(
      i => ({

        id:
          `music${String(i).padStart(2,"0")}`,

        type:
          "music",

        title:
          `音樂 ${String(i).padStart(2,"0")}`,

        url:
          `${LIBRARY_BASE}music${String(i).padStart(2,"0")}.mp3`

      })
    ),


  splice:

    Array
      .from(
        {length:62},
        (_,n)=>n+1
      )

      .map(
        i => ({

          id:
            `splice${String(i).padStart(2,"0")}`,

          type:
            "splice",

          title:
            `拼接 ${String(i).padStart(2,"0")}`,

          url:
            `${LIBRARY_BASE}拼接素材/${i}_拼接素材.mp3`

        })
      ),


  effect:

    Array
      .from(
        {length:40},
        (_,n)=>n+1
      )

      .map(
        i => ({

          id:
            `effect${String(i).padStart(2,"0")}`,

          type:
            "effect",

          title:
            `音效 ${String(i).padStart(2,"0")}`,

          url:
            `${LIBRARY_BASE}effect${String(i).padStart(2,"0")}.${i<=20?"wav":"mp3"}`

        })
      )

};


/* =========================================================
   03｜剪輯資料
   ========================================================= */

let clips = [];
let beats = [];
let assets = new Map();

let selectedClipId = null;

let undoStack = [];
let redoStack = [];

let isPlaying = false;
let activeSources = [];

let playRAF = 0;

let playStartCtx = 0;
let playStartTimeline = 0;


/* =========================================================
   04｜畫面元素
   ========================================================= */

const timelineShell =
  document.getElementById("timelineShell");

const timelineScroll =
  document.getElementById("timelineScroll");

const timelineContent =
  document.getElementById("timelineContent");

const ruler =
  document.getElementById("ruler");

const tracksBg =
  document.getElementById("tracksBg");

const beatsLayer =
  document.getElementById("beatsLayer");

const clipsLayer =
  document.getElementById("clipsLayer");

const emptyTimeline =
  document.getElementById("emptyTimeline");

   08｜標記
   ========================================================= */

function favoriteKey(id){

  return "favorite_" + id;

}

function isMarked(id){

  return (
    localStorage.getItem(
      favoriteKey(id)
    ) === "true"
  );

}

function toggleMarked(id){

  localStorage.setItem(

    favoriteKey(id),

    isMarked(id)
      ? "false"
      : "true"

  );

}


/* =========================================================
   09｜素材面板
   ========================================================= */

function openMaterialPanel(type){

  const names = {

    music:"🎵 音樂",

    splice:"✂️ 拼接",

    effect:"🔊 音效"

  };


  const list =

    [...MATERIALS[type]]

    .sort(
      (a,b) =>
        Number(isMarked(b.id)) -
        Number(isMarked(a.id))
    );


  openModal(

    names[type],

    `

    <div class="material-note">

      這裡讀的是我們自己的
      「自由品勢音樂與音效素材庫」。

      <br>

      按「使用」才會加入時間軸。

    </div>

    <div class="material-list">

      ${list.map(materialCardHTML).join("")}

    </div>

    `

  );


  bindMaterialPanel(
    type
  );

}


/* =========================================================
   10｜素材卡片
   ========================================================= */

function materialCardHTML(m){

  const marked =
    isMarked(m.id);


  const symbol =

    m.type === "music"

      ? (
          marked
            ? "♥"
            : "♡"
        )

      : m.type === "effect"

        ? (
            marked
              ? "★"
              : "☆"
          )

        : "✂";


  return `

  <div
    class="material-card"
    data-material-id="${m.id}"
  >

    <div>

      <div class="material-name">
        ${escapeHtml(m.title)}
      </div>

      <div class="material-sub">

        ${
          m.type === "music"
            ? "音樂"
            : m.type === "splice"
              ? "拼接"
              : "音效"
        }

      </div>

    </div>

    <audio
      controls
      preload="none"
      src="${m.url}"
    ></audio>

    <button
      class="mark-btn ${m.type} ${marked ? "on" : ""}"
      data-mark="${m.id}"
    >
      ${symbol}
    </button>

    <button
      class="use-btn"
      data-use="${m.id}"
    >
      使用
    </button>

  </div>

  `;

}

/* =========================================================
   12｜從素材庫加入
   ========================================================= */

async function addLibraryMaterial(m){

  await audioContext.resume();


  const response =
    await fetch(
      m.url,
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const blob =
    await response.blob();


  const buffer =
    await audioContext
      .decodeAudioData(
        (
          await blob.arrayBuffer()
        )
        .slice(0)
      );


  const assetId =
    "asset_" +
    m.id +
    "_" +
    Date.now();


  assets.set(

    assetId,

    {

      id:assetId,

      name:m.title,

      type:m.type,

      blob:blob,

      buffer:buffer,

      duration:buffer.duration,

      peaks:
        createPeaks(
          buffer,
          5000
        ),

      sourceUrl:m.url

    }

  );


  addNewClipFromAsset(

    assetId,

    m.title,

    m.type

  );

}


/* =========================================================
   13｜自己上傳音樂
   ========================================================= */

async function addUploadedFiles(files){

  pushHistory();


  for(const file of files){

    try{

      showToast(
        "正在讀取音樂波形…"
      );


      const buffer =
        await audioContext
          .decodeAudioData(
            (
              await file.arrayBuffer()
            )
            .slice(0)
          );


      const assetId =
        uid("asset");


      assets.set(

        assetId,

        {

          id:assetId,

          name:file.name,

          type:"music",

          blob:file,

          buffer:buffer,

          duration:buffer.duration,

          peaks:
            createPeaks(
              buffer,
              5000
            ),

          sourceUrl:null

        }

      );


      addNewClipFromAsset(

        assetId,

        file.name,

        "music",

        false

      );

    }
    catch(err){

      console.error(err);

      showToast(
        "⚠️ 有音訊檔無法讀取"
      );

    }

  }


  normalizeTracks();

  renderAll();

  showToast(
    "✅ 已加入自己的音樂"
  );

}


/* =========================================================
   14｜新增片段
   ========================================================= */

function addNewClipFromAsset(
  assetId,
  name,
  type,
  saveHistory=true
){

  if(saveHistory){

    pushHistory();

  }


  const a =
    assets.get(assetId);


  if(!a){
    return;
  }


  const newTrack =

    clips.length

      ? Math.max(
          ...clips.map(
            c => c.track
          )
        ) + 1

      : 0;


  clips.push({

    id:
      uid("clip"),

    assetId:assetId,

    name:name,

    type:type,

    track:newTrack,

    start:
      getPlayheadTime(),

    trimStart:0,

    trimEnd:
      a.duration,

    volume:1,

    muted:false,

    speed:1,

    fadeIn:0,

    fadeOut:0

  });


  normalizeTracks();

  renderAll();

}


/* =========================================================
   15｜分析真正波形
   ========================================================= */

function createPeaks(
  buffer,
  count
){

  const n =
    Math.min(
      count,
      buffer.length
    );


  const peaks =
    new Float32Array(n);


  const step =
    buffer.length / n;


  for(
    let i=0;
    i<n;
    i++
  ){

    const s =
      Math.floor(
        i * step
      );


    const e =
      Math.min(
        buffer.length,
        Math.floor(
          (i+1) *
          step
        )
      );


    let max = 0;


    for(
      let ch=0;
      ch<buffer.numberOfChannels;
      ch++
    ){

      const data =
        buffer.getChannelData(ch);


      for(
        let j=s;
        j<e;
        j++
      ){

        const v =
          Math.abs(data[j]);


        if(v>max){

          max = v;

        }

      }

    }


    peaks[i] = max;

  }


  return peaks;

}


/* =========================================================
   16｜基本時間計算
   ========================================================= */

function clipDuration(c){

  return Math.max(

    MIN_CLIP,

    (
      c.trimEnd -
      c.trimStart
    )
    /
    c.speed

  );

}


function clipEnd(c){

  return (
    c.start +
    clipDuration(c)
  );

}


function projectDuration(){

  return Math.max(

    0,

    ...clips.map(
      clipEnd
    ),

    ...beats,

    0

  );

}


function getSelected(){

  return (
    clips.find(
      c =>
        c.id ===
        selectedClipId
    )
    ||
    null
  );

}


function leftPad(){

  return (
    timelineShell.clientWidth /
    2
  );

}


function getPlayheadTime(){

  return Math.max(

    0,

    timelineScroll.scrollLeft /
    PPS

  );

}


function setPlayheadTime(t){

  timelineScroll.scrollLeft =
    Math.max(
      0,
      t *
      PPS
    );

}


function trackCount(){

  return clips.length

    ? Math.max(
        ...clips.map(
          c => c.track
        )
      ) + 1

    : 0;

}


/* =========================================================
   17｜重畫畫面
   ========================================================= */

function renderAll(){

  const keep =
    timelineScroll.scrollLeft;


  const pad =
    leftPad();


  const duration =
    Math.max(

      DEFAULT_DURATION,

      Math.ceil(
        projectDuration() +
        10
      )

    );


  const tracks =
    trackCount();


  timelineContent.style.width =

    (
      pad * 2 +
      duration * PPS
    )
    +
    "px";


  timelineContent.style.height =

    (
      RULER_H +
      Math.max(
        240,
        tracks *
        TRACK_H +
        40
      )
    )
    +
    "px";


  renderRuler(
    duration,
    pad
  );


  renderTracks(
    tracks
  );


  renderBeats(
    pad
  );


  renderClips(
    pad
  );


  emptyTimeline.style.display =

    clips.length
      ? "none"
      : "block";


  updateToolState();


  requestAnimationFrame(
    () => {

      timelineScroll.scrollLeft =
        keep;

    }
  );

}

/* =========================================================
   22｜畫真實波形
   ========================================================= */

function drawWave(
  canvas,
  c,
  a
){

  const w =
    Math.max(
      1,
      Math.floor(
        canvas.clientWidth
      )
    );


  const h =
    Math.max(
      1,
      Math.floor(
        canvas.clientHeight
      )
    );


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    Math.floor(
      w *
      dpr
    );


  canvas.height =
    Math.floor(
      h *
      dpr
    );


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  const start =
    Math.floor(

      (
        c.trimStart /
        a.duration
      )

      *

      a.peaks.length

    );


  const end =
    Math.max(

      start + 1,

      Math.floor(

        (
          c.trimEnd /
          a.duration
        )

        *

        a.peaks.length

      )

    );


  const mid =
    h / 2;


  ctx.beginPath();


  for(
    let x=0;
    x<w;
    x++
  ){

    const idx =
      Math.min(

        a.peaks.length - 1,

        start +

        Math.floor(

          (
            x /
            Math.max(
              1,
              w-1
            )
          )

          *

          (
            end -
            start
          )

        )

      );


    const amp =
      a.peaks[idx] ||
      0;


    const y =
      amp *
      mid *
      .95;


    if(x===0){

      ctx.moveTo(
        x,
        mid-y
      );

    }
    else{

      ctx.lineTo(
        x,
        mid-y
      );

    }

  }


  for(
    let x=w-1;
    x>=0;
    x--
  ){

    const idx =
      Math.min(

        a.peaks.length - 1,

        start +

        Math.floor(

          (
            x /
            Math.max(
              1,
              w-1
            )
          )

          *

          (
            end -
            start
          )

        )

      );


    const amp =
      a.peaks[idx] ||
      0;


    const y =
      amp *
      mid *
      .95;


    ctx.lineTo(
      x,
      mid+y
    );

  }


  ctx.closePath();


  ctx.fillStyle =
    "rgba(255,255,255,.93)";


  ctx.fill();

}


/* =========================================================
   23｜片段操作
   ========================================================= */

function bindClipEvents(
  el,
  c
){

  el.addEventListener(
    "click",
    e => {

      if(
        e.target.classList.contains(
          "trim-handle"
        )
      ){
        return;
      }


      selectedClipId =
        c.id;


      renderAll();

    }
  );


  el.addEventListener(
    "pointerdown",
    e => {

      if(
        e.target.classList.contains(
          "trim-handle"
        )
      ){
        return;
      }


      if(e.button!==0){
        return;
      }


      startClipDrag(
        e,
        el,
        c
      );

    }
  );


  el
    .querySelector(
      ".trim-handle.left"
    )
    .addEventListener(
      "pointerdown",
      e => {

        startTrim(
          e,
          el,
          c,
          "left"
        );

      }
    );


  el
    .querySelector(
      ".trim-handle.right"
    )
    .addEventListener(
      "pointerdown",
      e => {

        startTrim(
          e,
          el,
          c,
          "right"
        );

      }
    );

}


/* =========================================================
   24｜上下左右拖動
   ========================================================= */

function startClipDrag(
  e,
  el,
  c
){

  e.preventDefault();

  pushHistory();

  selectedClipId =
    c.id;


  const sx =
    e.clientX;

  const sy =
    e.clientY;

  const oldStart =
    c.start;

  const oldTrack =
    c.track;


  const maxTrackNow =
    Math.max(
      0,
      trackCount()
    );


  el.classList.add(
    "dragging"
  );


  function move(ev){

    c.start =
      Math.max(

        0,

        oldStart +

        (
          ev.clientX -
          sx
        )
        /
        PPS

      );


    const deltaTrack =
      Math.round(

        (
          ev.clientY -
          sy
        )
        /
        TRACK_H

      );


    c.track =
      Math.max(

        0,

        Math.min(

          maxTrackNow,

          oldTrack +
          deltaTrack

        )

      );


    const pad =
      leftPad();


    el.style.left =
      (
        pad +
        c.start *
        PPS
      )
      +
      "px";


    el.style.top =
      (
        RULER_H +
        c.track *
        TRACK_H +
        6
      )
      +
      "px";

  }


  function up(){

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );


    pushCollisions(c);

    normalizeTracks();

    renderAll();

  }


  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}


/* =========================================================
   25｜左右拉長縮短
   ========================================================= */

function startTrim(
  e,
  el,
  c,
  side
){

  e.preventDefault();

  e.stopPropagation();

  pushHistory();

  selectedClipId =
    c.id;


  const sx =
    e.clientX;

  const oldStart =
    c.start;

  const oldTrimStart =
    c.trimStart;

  const oldTrimEnd =
    c.trimEnd;


  const a =
    assets.get(
      c.assetId
    );


  function move(ev){

    const deltaTimeline =
      (
        ev.clientX -
        sx
      )
      /
      PPS;


    const deltaSource =
      deltaTimeline *
      c.speed;


    if(side==="right"){

      c.trimEnd =
        Math.min(

          a.duration,

          Math.max(

            oldTrimStart +
            MIN_CLIP *
            c.speed,

            oldTrimEnd +
            deltaSource

          )

        );

    }
    else{

      const newTrim =
        Math.min(

          oldTrimEnd -
          MIN_CLIP *
          c.speed,

          Math.max(

            0,

            oldTrimStart +
            deltaSource

          )

        );


      const shift =
        (
          newTrim -
          oldTrimStart
        )
        /
        c.speed;


      c.trimStart =
        newTrim;


      c.start =
        Math.max(

          0,

          oldStart +
          shift

        );

    }


    const pad =
      leftPad();


    el.style.left =
      (
        pad +
        c.start *
        PPS
      )
      +
      "px";


    el.style.width =
      Math.max(
        34,
        clipDuration(c) *
        PPS
      )
      +
      "px";


    drawWave(

      el.querySelector("canvas"),

      c,

      a

    );

  }


  function up(){

    window.removeEventListener(
      "pointermove",
      move
    );

    window.removeEventListener(
      "pointerup",
      up
    );


    pushCollisions(c);

    normalizeTracks();

    renderAll();

  }


  window.addEventListener(
    "pointermove",
    move
  );

  window.addEventListener(
    "pointerup",
    up
  );

}


/* =========================================================
   26｜碰撞判斷
   ========================================================= */

function overlaps(a,b){

  return (

    a.track === b.track

    &&

    a.start <
    clipEnd(b) -
    .001

    &&

    clipEnd(a) >
    b.start +
    .001

  );

}


/* =========================================================
   27｜碰撞自動讓位
   ========================================================= */

function pushCollisions(moved){

  const q =
    [moved];


  let guard =
    0;


  while(
    q.length &&
    guard++ < 200
  ){

    const cur =
      q.shift();


    const end =
      clipEnd(cur);


    clips.forEach(
      o => {

        if(

          o.id !== cur.id

          &&

          o.track === cur.track

          &&

          overlaps(
            cur,
            o
          )

        ){

          o.start =
            end +
            .02;


          q.push(o);

        }

      }
    );

  }

}


/* =========================================================
   28｜空軌道收起
   ========================================================= */

function normalizeTracks(){

  if(!clips.length){
    return;
  }


  const used =

    [
      ...new Set(
        clips.map(
          c => c.track
        )
      )
    ]

    .sort(
      (a,b) =>
        a-b
    );


  const map =
    new Map(

      used.map(
        (v,i) =>
          [v,i]
      )

    );


  clips.forEach(
    c => {

      c.track =
        map.get(
          c.track
        );

    }
  );

}

/* =========================================================
   32｜節拍
   ========================================================= */

function addBeat(){

  pushHistory();


  const t =
    getPlayheadTime();


  const i =
    beats.findIndex(
      x =>
        Math.abs(
          x-t
        ) < .15
    );


  if(i>=0){

    beats.splice(
      i,
      1
    );

  }
  else{

    beats.push(t);

  }


  beats.sort(
    (a,b) =>
      a-b
  );


  renderAll();


  showToast(

    i>=0
      ? "🚩 已移除節拍"
      : "🚩 已加入節拍"

  );

}


/* =========================================================
   33｜分割
   ========================================================= */

function splitSelected(){

  const c =
    getSelected();


  if(!c){
    return;
  }


  const t =
    getPlayheadTime();


  if(

    t <=
    c.start +
    .02

    ||

    t >=
    clipEnd(c) -
    .02

  ){

    return showToast(
      "請把白線放在片段中間"
    );

  }


  pushHistory();


  const sourceSplit =

    c.trimStart +

    (
      t -
      c.start
    )

    *

    c.speed;


  const right = {

    ...c,

    id:
      uid("clip"),

    trimStart:
      sourceSplit,

    start:
      t

  };


  c.trimEnd =
    sourceSplit;


  clips.push(
    right
  );


  selectedClipId =
    right.id;


  renderAll();


  showToast(
    "✂️ 已分割"
  );

}

/* =========================================================
   40｜回上一步 / 重做
   ========================================================= */

function snapshot(){

  return JSON.stringify({

    clips:
      clips.map(
        c => ({
          ...c
        })
      ),

    beats:
      [...beats]

  });

}


function pushHistory(){

  undoStack.push(
    snapshot()
  );


  if(
    undoStack.length >
    60
  ){

    undoStack.shift();

  }


  redoStack = [];

}


function restoreSnapshot(s){

  const x =
    JSON.parse(s);


  clips =
    x.clips;


  beats =
    x.beats ||
    [];


  selectedClipId =
    null;


  normalizeTracks();

  renderAll();

}


function undoAction(){

  if(!undoStack.length){

    return showToast(
      "沒有可以回上一步的動作"
    );

  }


  redoStack.push(
    snapshot()
  );


  restoreSnapshot(
    undoStack.pop()
  );


  showToast(
    "↶ 已回上一步"
  );

}


function redoAction(){

  if(!redoStack.length){

    return showToast(
      "沒有可以重做的動作"
    );

  }


  undoStack.push(
    snapshot()
  );


  restoreSnapshot(
    redoStack.pop()
  );


  showToast(
    "↷ 已重做"
  );

}


/* =========================================================
   41｜多軌播放
   ========================================================= */

async function togglePlay(){

  if(isPlaying){

    stopPlayback();

    return;

  }


  if(!clips.length){

    return showToast(
      "請先加入素材"
    );

  }


  await audioContext.resume();


  startPlayback();

}


function startPlayback(){

  stopPlayback();


  isPlaying =
    true;


  document
    .querySelector(
      "#playBtn .tool-icon"
    )
    .textContent =
      "■";


  playStartTimeline =
    getPlayheadTime();


  playStartCtx =
    audioContext.currentTime;


  activeSources = [];


  clips.forEach(
    c => {

      if(c.muted){
        return;
      }


      const a =
        assets.get(
          c.assetId
        );


      if(
        !a ||
        clipEnd(c) <=
        playStartTimeline
      ){

        return;

      }


      const timelineStart =
        Math.max(
          playStartTimeline,
          c.start
        );


      const delay =
        timelineStart -
        playStartTimeline;


      const sourceOffset =

        c.trimStart +

        (
          timelineStart -
          c.start
        )

        *

        c.speed;


      const sourceDuration =
        Math.max(

          0,

          c.trimEnd -
          sourceOffset

        );


      if(sourceDuration<=0){
        return;
      }


      const source =
        audioContext
          .createBufferSource();


      const gain =
        audioContext
          .createGain();


      source.buffer =
        a.buffer;


      source.playbackRate.value =
        c.speed;


      source
        .connect(gain)
        .connect(
          audioContext.destination
        );


      const when =
        audioContext.currentTime +
        delay;


      const tDur =
        sourceDuration /
        c.speed;


      const base =
        c.volume;


      const relative =
        timelineStart -
        c.start;


      let initial =
        base;


      if(
        c.fadeIn>0 &&
        relative<c.fadeIn
      ){

        initial =
          base *
          (
            relative /
            c.fadeIn
          );

      }


      if(
        c.fadeOut>0 &&
        relative >
        clipDuration(c) -
        c.fadeOut
      ){

        initial =
          Math.min(

            initial,

            base *
            (
              (
                clipDuration(c) -
                relative
              )
              /
              c.fadeOut
            )

          );

      }


      gain.gain
        .setValueAtTime(

          Math.max(
            0,
            initial
          ),

          when

        );


      if(
        c.fadeIn>0 &&
        relative<c.fadeIn
      ){

        gain.gain
          .linearRampToValueAtTime(

            base,

            when +
            (
              c.fadeIn -
              relative
            )

          );

      }


      const fadeOutStart =
        clipDuration(c) -
        c.fadeOut;


      if(
        c.fadeOut>0 &&
        relative<fadeOutStart
      ){

        gain.gain
          .setValueAtTime(

            base,

            when +
            (
              fadeOutStart -
              relative
            )

          );


        gain.gain
          .linearRampToValueAtTime(

            0,

            when +
            tDur

          );

      }
      else if(
        c.fadeOut>0
      ){

        gain.gain
          .linearRampToValueAtTime(

            0,

            when +
            tDur

          );

      }


      source.start(

        when,

        sourceOffset,

        sourceDuration

      );


      activeSources.push(
        source
      );

    }
  );


  animatePlayback();

}


/* =========================================================
   42｜播放時移動時間軸
   ========================================================= */

function animatePlayback(){

  if(!isPlaying){
    return;
  }


  const t =

    playStartTimeline +

    (
      audioContext.currentTime -
      playStartCtx
    );


  setPlayheadTime(t);


  if(
    t >=
    projectDuration() +
    .05
  ){

    stopPlayback();

    return;

  }


  playRAF =
    requestAnimationFrame(
      animatePlayback
    );

}


/* =========================================================
   43｜停止播放
   ========================================================= */

function stopPlayback(){

  activeSources
    .forEach(
      s => {

        try{
          s.stop();
        }
        catch{}

      }
    );


  activeSources = [];


  cancelAnimationFrame(
    playRAF
  );


  if(isPlaying){

    isPlaying = false;


    document
      .querySelector(
        "#playBtn .tool-icon"
      )
      .textContent =
        "▶";

  }

}

/* =========================================================
   45｜混合所有軌道
   ========================================================= */

async function renderMixToWav(){

  const duration =
    Math.max(
      .1,
      projectDuration()
    );


  const rate =
    44100;


  const offline =
    new OfflineAudioContext(

      2,

      Math.ceil(
        duration *
        rate
      ),

      rate

    );


  clips.forEach(
    c => {

      if(c.muted){
        return;
      }


      const a =
        assets.get(
          c.assetId
        );


      if(!a){
        return;
      }


      const source =
        offline
          .createBufferSource();


      const gain =
        offline
          .createGain();


      source.buffer =
        a.buffer;


      source.playbackRate.value =
        c.speed;


      source
        .connect(gain)
        .connect(
          offline.destination
        );


      const start =
        c.start;


      const d =
        clipDuration(c);


      const g =
        c.volume;


      gain.gain
        .setValueAtTime(

          c.fadeIn>0
            ? 0
            : g,

          start

        );


      if(c.fadeIn>0){

        gain.gain
          .linearRampToValueAtTime(

            g,

            start +
            Math.min(
              c.fadeIn,
              d
            )

          );

      }


      if(c.fadeOut>0){

        const fs =
          Math.max(

            start,

            start +
            d -
            c.fadeOut

          );


        gain.gain
          .setValueAtTime(
            g,
            fs
          );


        gain.gain
          .linearRampToValueAtTime(

            0,

            start +
            d

          );

      }


      source.start(

        start,

        c.trimStart,

        c.trimEnd -
        c.trimStart

      );

    }
  );


  return audioBufferToWavBlob(

    await offline
      .startRendering()

  );

}


/* =========================================================
   46｜AudioBuffer 轉 WAV
   ========================================================= */

function audioBufferToWavBlob(buffer){

  const channels =
    buffer.numberOfChannels;


  const rate =
    buffer.sampleRate;


  const length =
    buffer.length;


  const block =
    channels *
    2;


  const ab =
    new ArrayBuffer(

      44 +

      length *
      block

    );


  const view =
    new DataView(ab);


  let p = 0;


  const str =
    s => {

      for(
        let i=0;
        i<s.length;
        i++
      ){

        view.setUint8(

          p++,

          s.charCodeAt(i)

        );

      }

    };


  str("RIFF");


  view.setUint32(
    p,
    36 +
    length *
    block,
    true
  );

  p += 4;


  str("WAVE");

  str("fmt ");


  view.setUint32(
    p,
    16,
    true
  );

  p += 4;


  view.setUint16(
    p,
    1,
    true
  );

  p += 2;


  view.setUint16(
    p,
    channels,
    true
  );

  p += 2;


  view.setUint32(
    p,
    rate,
    true
  );

  p += 4;


  view.setUint32(

    p,

    rate *
    block,

    true

  );

  p += 4;


  view.setUint16(
    p,
    block,
    true
  );

  p += 2;


  view.setUint16(
    p,
    16,
    true
  );

  p += 2;


  str("data");


  view.setUint32(

    p,

    length *
    block,

    true

  );

  p += 4;


  const data =

    Array.from(

      {
        length:channels
      },

      (_,ch) =>
        buffer
          .getChannelData(ch)

    );


  for(
    let i=0;
    i<length;
    i++
  ){

    for(
      let ch=0;
      ch<channels;
      ch++
    ){

      let s =
        Math.max(

          -1,

          Math.min(
            1,
            data[ch][i]
          )

        );


      view.setInt16(

        p,

        s<0
          ? s*0x8000
          : s*0x7fff,

        true

      );


      p += 2;

    }

  }


  return new Blob(

    [ab],

    {
      type:"audio/wav"
    }

  );

}

                class="row-btn"
                data-open-draft="${d.id}"
              >
                開啟繼續剪輯
              </button>


              ${
                d.finalBlob

                  ?

                  `

                  <button
                    class="row-btn"
                    data-download-draft="${d.id}"
                  >
                    下載成品
                  </button>

                  `

                  :

                  ""
              }

            </div>

            `
          )

          .join("")

        :

        `

        <div class="storage-note">
          目前還沒有草稿。
        </div>

        `

    }

    `

  );


  document
    .getElementById(
      "saveDraftNow"
    )
    .addEventListener(
      "click",
      saveCurrentDraft
    );


  document
    .querySelectorAll(
      "[data-open-draft]"
    )
    .forEach(
      b => {

        b.addEventListener(
          "click",
          () => {

            loadDraft(
              b.dataset.openDraft
            );

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-download-draft]"
    )
    .forEach(
      b => {

        b.addEventListener(
          "click",
          async () => {

            const d =
              await dbGet(

                "drafts",

                b.dataset
                  .downloadDraft

              );


            if(d?.finalBlob){

              downloadBlob(

                d.finalBlob,

                d.name +
                ".wav"

              );

            }

          }
        );

      }
    );

}


/* =========================================================
   48｜保留目前草稿
   ========================================================= */

async function saveCurrentDraft(){

  if(!clips.length){

    return showToast(
      "目前沒有可以保存的剪輯內容"
    );

  }


  const def =
    makeDefaultName() +
    "_草稿";


  const name =

    (
      prompt(
        "草稿名稱",
        def
      )
      ||
      def
    )
    .trim()
    ||
    def;


  const assetRecords =
    await collectProjectAssets();


  await dbPut(

    "drafts",

    {

      id:
        uid("draft"),

      name:name,

      createdAt:
        new Date()
          .toISOString(),

      duration:
        projectDuration(),

      clips:
        clips.map(
          c => ({
            ...c
          })
        ),

      beats:
        [...beats],

      assets:
        assetRecords,

      finalBlob:null,

      productId:null

    }

  );


  closeModal();


  showToast(
    "📝 已保留新草稿，不覆蓋舊草稿"
  );

}


/* =========================================================
   49｜草稿保存素材
   ========================================================= */

async function collectProjectAssets(){

  const used =

    [
      ...new Set(
        clips.map(
          c =>
            c.assetId
        )
      )
    ];


  const arr = [];


  for(const id of used){

    const a =
      assets.get(id);


    if(a){

      arr.push({

        id:a.id,

        name:a.name,

        type:a.type,

        blob:a.blob,

        sourceUrl:
          a.sourceUrl ||
          null

      });

    }

  }


  return arr;

}


/* =========================================================
   50｜開啟草稿
   ========================================================= */

async function loadDraft(id){

  const d =
    await dbGet(
      "drafts",
      id
    );


  if(!d){
    return;
  }


  stopPlayback();

  assets.clear();


  for(const a of d.assets){

    const buffer =
      await audioContext
        .decodeAudioData(
          (
            await a.blob
              .arrayBuffer()
          )
          .slice(0)
        );


    assets.set(

      a.id,

      {

        ...a,

        buffer:buffer,

        duration:
          buffer.duration,

        peaks:
          createPeaks(
            buffer,
            5000
          )

      }

    );

  }


  clips =
    d.clips.map(
      c => ({
        ...c
      })
    );


  beats =
    [
      ...(
        d.beats ||
        []
      )
    ];


  selectedClipId =
    null;


  undoStack = [];

  redoStack = [];


  closeModal();


  normalizeTracks();

  renderAll();

  setPlayheadTime(0);


  showToast(
    "📝 已開啟草稿，可繼續剪輯"
  );

}


/* =========================================================
   51｜成品
   ========================================================= */

async function showProducts(){

    (
      await dbGetAll(
        "products"
      )
    )

    .sort(
      (a,b) =>
        b.createdAt
          .localeCompare(
            a.createdAt
          )
    );


  openModal(

    "🎵 成品",

    `

    <div class="storage-note">

      成品保存在目前這台裝置／
      這個瀏覽器。

      <br>

      可試聽、改檔名、下載；

      不提供刪除。

    </div>


    ${

      list.length

        ?

        list
          .map(
            p => {

              const u =
                URL.createObjectURL(
                  p.blob
                );


              return `

              <div class="list-row">

                <div class="list-info">

                  <div class="list-name">
                    ${escapeHtml(p.name)}
                  </div>

                  <div class="list-meta">

                      new Date(
                        p.createdAt
                      )
                      .toLocaleString()
                    }

                    ｜

                    ${formatPrecise(p.duration)}

                  </div>

                  <audio
                    controls
                    src="${u}"
                  ></audio>

                </div>


                <button
                  class="row-btn"
                  data-rename-product="${p.id}"
                >
                  ✏️ 改檔名
                </button>


                <button
                  class="row-btn"
                  data-download-product="${p.id}"
                >
                  ⬇️ 下載
                </button>

              </div>

              `;

            }
          )

          .join("")

        :

        `

        <div class="storage-note">
          目前還沒有成品。
        </div>

        `

    }

    `

  );


  document
    .querySelectorAll(
      "[data-download-product]"
    )
    .forEach(
      b => {

        b.addEventListener(
          "click",
          async () => {

            const p =
              await dbGet(

                "products",

                b.dataset
                  .downloadProduct

              );


            if(p){

              downloadBlob(

                p.blob,

                p.name +
                ".wav"

              );

            }

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-rename-product]"
    )
    .forEach(
      b => {

        b.addEventListener(
          "click",
          async () => {

            const p =
              await dbGet(

                "products",

                b.dataset
                  .renameProduct

              );


            if(!p){
              return;
            }


            const n =
              prompt(

                "輸入新的成品名稱",

                p.name

              );


            if(
              !n ||
              !n.trim()
            ){
              return;
            }


            p.name =
              n.trim();


            await dbPut(
              "products",
              p
            );


            showProducts();

          }
        );

      }
    );

}


/* =========================================================
   52｜IndexedDB
   ========================================================= */

const DB_NAME =
  "taekwondo_editor_v2";

const DB_VERSION =
  1;


function openDB(){

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const req =
        indexedDB.open(

          DB_NAME,

          DB_VERSION

        );


      req.onupgradeneeded =
        () => {

          const db =
            req.result;


          if(
            !db.objectStoreNames
              .contains(
                "drafts"
              )
          ){

            db.createObjectStore(

              "drafts",

              {
                keyPath:"id"
              }

            );

          }


          if(
            !db.objectStoreNames
              .contains(
                "products"
              )
          ){

            db.createObjectStore(

              "products",

              {
                keyPath:"id"
              }

            );

          }

        };


      req.onsuccess =
        () => {

          resolve(
            req.result
          );

        };


      req.onerror =
        () => {

          reject(
            req.error
          );

        };

    }

  );

}


/* =========================================================
   53｜資料庫寫入
   ========================================================= */

async function dbPut(
  store,
  value
){

  const db =
    await openDB();


  return new Promise(

    (
      resolve,
      reject
    ) => {

      const tx =
        db.transaction(
          store,
          "readwrite"
        );


      tx
        .objectStore(store)
        .put(value);


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(
          tx.error
        );

    }

  );

}


/* =========================================================
   54｜資料庫全部
   ========================================================= */

async function dbGetAll(store){

  const db =
    await openDB();


  return new Promise(

    (
      resolve,
      reject
    ) => {

      const req =
        db
          .transaction(
            store,
            "readonly"
          )
          .objectStore(store)
          .getAll();


      req.onsuccess =
        () => {

          resolve(
            req.result
          );

        };


      req.onerror =
        () => {

          reject(
            req.error
          );

        };

    }

  );

}


/* =========================================================
   55｜資料庫單筆
   ========================================================= */

async function dbGet(
  store,
  id
){

  const db =
    await openDB();


  return new Promise(

    (
      resolve,
      reject
    ) => {

      const req =
        db
          .transaction(
            store,
            "readonly"
          )
          .objectStore(store)
          .get(id);


      req.onsuccess =
        () => {

          resolve(
            req.result
          );

        };


      req.onerror =
        () => {

          reject(
            req.error
          );

        };

    }

  );

}


/* =========================================================

function openModal(

  html
){

    .getElementById(
      "modalTitle"
    )
    .textContent =

  document
    .getElementById(
      "modalBody"
    )

    )
    .classList
    .add(

    );

    .getElementById(
      "modalBackdrop"
    )
    .classList
    .remove(
      "show"
    );

}


document
  .getElementById(
    "modalClose"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "modalBackdrop"
  )
  .addEventListener(
    "click",

      if(
        e.target.id ===

      ){

/* =========================================================
   57｜提示
   ========================================================= */

function showToast(text){

  const t =
    document.getElementById(
      "toast"
    );


  t.textContent =
    text;


  t.style.display =
    "block";


  clearTimeout(
    showToast.timer
  );


  showToast.timer =
    setTimeout(
      () => {

        t.style.display =
          "none";

      },
      1800
    );

}


/* =========================================================
   58｜ID
   ========================================================= */

function uid(
  prefix="id"
){

  return (

    `${prefix}_${Date.now()}_${

      Math
        .random()
        .toString(36)
        .slice(2,8)

    }`

  );

}


/* =========================================================
   59｜安全文字
   ========================================================= */

function escapeHtml(t){

  return String(t)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   60｜時間格式
   ========================================================= */

function formatTime(sec){

  sec =
    Math.max(
      0,
      sec ||
      0
    );


  const m =
    Math.floor(
      sec /
      60
    );


  const s =
    Math.floor(
      sec %
      60
    );


  return (

    `${

      String(m)
        .padStart(
          2,
          "0"
        )

    }:${

      String(s)
        .padStart(
          2,
          "0"
        )

    }`

  );

}


function formatPrecise(sec){

  sec =
    Math.max(
      0,
      sec ||
      0
    );


  const m =
    Math.floor(
      sec /
      60
    );


  const s =
    (
      sec %
      60
    )
    .toFixed(1)
    .padStart(
      4,
      "0"
    );


  return (

    `${

      String(m)
        .padStart(
          2,
          "0"
        )

    }:${s}`

  );

}


/* =========================================================
   61｜作品名稱
   ========================================================= */

function makeDefaultName(){

  const d =
    new Date();


  return (

    `自由品勢作品_${

      d.getFullYear()

    }${

      String(
        d.getMonth() +
        1
      )
      .padStart(
        2,
        "0"
      )

    }${

      String(
        d.getDate()
      )
      .padStart(
        2,
        "0"
      )

    }_${

      String(
        d.getHours()
      )
      .padStart(
        2,
        "0"
      )

    }${

      String(
        d.getMinutes()
      )
      .padStart(
        2,
        "0"
      )

    }`

  );

}


/* =========================================================
   62｜下載
   ========================================================= */

function downloadBlob(
  blob,
  name
){

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    2000
  );

}
