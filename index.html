<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>自由品勢音樂剪輯器</title>


<style>

/* ==================================================
   01｜全站基本設定
================================================== */

* {
  box-sizing: border-box;
}

:root {

  --bg: #101010;

  --panel: #171717;

  --panel2: #202020;

  --panel3: #2b2b2b;

  --line: #383838;

  --text: #ffffff;

  --sub: #a6a6a6;

  --pink: #ff2d68;

  --music: #0e9aa7;

  --splice: #7657d8;

  --effect: #d18718;

}

body {

  margin: 0;

  background: var(--bg);

  color: var(--text);

  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;

  min-height: 100vh;

}

button {

  font-family: inherit;

}


/* ==================================================
   02｜最上方
   只保留：
   回音樂素材 / 上傳音樂 / 完成
================================================== */

.topbar {

  height: 64px;

  padding:
    0 18px;

  background:
    #181818;

  border-bottom:
    1px solid var(--line);

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 12px;

}


.top-left {

  display: flex;

  align-items: center;

}


.top-right {

  display: flex;

  align-items: center;

  gap: 10px;

}


.top-button {

  border: none;

  border-radius: 10px;

  padding:
    11px 16px;

  background:
    #303030;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}


.top-button:hover {

  background:
    #3b3b3b;

}


.finish-button {

  background:
    var(--pink);

}


.finish-button:hover {

  background:
    #ff477a;

}


/* ==================================================
   03｜剪輯器標題區
================================================== */

.editor-title {

  min-height: 90px;

  background:
    #0c0c0c;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  border-bottom:
    1px solid #2c2c2c;

}


.editor-title-icon {

  font-size: 32px;

  margin-bottom: 6px;

}


.editor-title-main {

  font-size: 18px;

  font-weight: bold;

}


.editor-title-small {

  margin-top: 5px;

  color: #8d8d8d;

  font-size: 12px;

}


/* ==================================================
   04｜時間軸外框
================================================== */

.timeline-area {

  position: relative;

  height: 330px;

  background:
    #1c1c1c;

  border-bottom:
    1px solid var(--line);

  overflow: hidden;

}


/* ==================================================
   05｜時間刻度
================================================== */

.ruler {

  height: 42px;

  display: flex;

  align-items: center;

  padding-left: 42px;

  color:
    #a5a5a5;

  font-size: 12px;

  white-space: nowrap;

  border-bottom:
    1px solid #333;

}


.ruler span {

  width: 120px;

  flex-shrink: 0;

}


/* ==================================================
   06｜中央固定白色播放線
================================================== */

.playhead {

  position: absolute;

  left: 50%;

  top: 42px;

  bottom: 0;

  width: 3px;

  background:
    white;

  z-index: 50;

  pointer-events: none;

}


.playhead::before {

  content: "";

  position: absolute;

  top: -6px;

  left: -5px;

  width: 13px;

  height: 13px;

  border-radius: 50%;

  background:
    white;

}


/* ==================================================
   07｜時間軸捲動區
================================================== */

.timeline-scroll {

  position: relative;

  height:
    calc(100% - 42px);

  overflow-x: auto;

  overflow-y: auto;

  padding:
    22px 34px 45px;

}


.track-container {

  position: relative;

  min-width: 1350px;

  min-height: 210px;

}


/* ==================================================
   08｜沒有素材時
================================================== */

.empty-timeline {

  width: 100%;

  min-height: 160px;

  display: flex;

  align-items: center;

  justify-content: center;

  color:
    #747474;

  font-size: 14px;

  text-align: center;

}


/* ==================================================
   09｜動態軌道
   有素材才出現
================================================== */

.track {

  position: relative;

  height: 70px;

  margin-bottom: 7px;

  border-radius: 8px;

  background:
    rgba(
      255,
      255,
      255,
      0.025
    );

}


/* ==================================================
   10｜素材片段
================================================== */

.clip {

  position: absolute;

  top: 5px;

  left: 0;

  height: 60px;

  min-width: 150px;

  border-radius: 8px;

  border:
    2px solid transparent;

  padding:
    7px 10px;

  color:
    white;

  cursor: pointer;

  overflow: hidden;

  user-select: none;

}


/* 音樂顏色 */

.clip.music {

  background:
    #087f8a;

}


/* 拼接顏色 */

.clip.splice {

  background:
    #6347bf;

}


/* 音效顏色 */

.clip.effect {

  background:
    #b66f12;

}


/* 選取片段 */

.clip.selected {

  border-color:
    white;

  box-shadow:
    0 0 0 2px
    var(--pink);

}


.clip-name {

  position: relative;

  z-index: 3;

  font-size: 12px;

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* ==================================================
   11｜暫時的波形外觀
   下一步再換成真正音訊波形
================================================== */

.fake-wave {

  position: absolute;

  left: 8px;

  right: 8px;

  bottom: 8px;

  height: 24px;

  opacity: .7;

  background:

    repeating-linear-gradient(

      90deg,

      rgba(
        255,
        255,
        255,
        .95
      )
      0px,

      rgba(
        255,
        255,
        255,
        .95
      )
      2px,

      transparent
      2px,

      transparent
      5px

    );

}


/* ==================================================
   12｜素材入口
   只有這一組
================================================== */

.material-bar {

  min-height: 68px;

  padding:
    9px 12px;

  background:
    #181818;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  border-bottom:
    1px solid var(--line);

}


.material-button {

  min-width: 120px;

  border: none;

  border-radius: 10px;

  padding:
    12px 18px;

  background:
    #2d2d2d;

  color:
    white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}


.material-button:hover {

  background:
    #3a3a3a;

}


/* ==================================================
   13｜剪輯工具全部放下面
================================================== */

.tool-area {

  background:
    #242424;

  padding:
    12px;

}


.tool-row {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 8px;

}


.tool-button {

  min-width: 105px;

  border: none;

  border-radius: 10px;

  padding:
    9px 10px;

  background:
    #333333;

  color:
    white;

  cursor: pointer;

}


.tool-button:hover {

  background:
    #404040;

}


.tool-icon {

  display: block;

  font-size: 21px;

}


.tool-name {

  display: block;

  margin-top: 4px;

  font-size: 13px;

  font-weight: bold;

}


.tool-desc {

  display: block;

  margin-top: 3px;

  color:
    #ababab;

  font-size: 10px;

}


/* ==================================================
   14｜片段沒選中時
   剪輯工具變灰
================================================== */

.need-clip:disabled {

  opacity:
    .28;

  cursor:
    default;

}


/* ==================================================
   15｜提示文字
================================================== */

.select-tip {

  background:
    #242424;

  color:
    #b3b3b3;

  text-align: center;

  font-size: 12px;

  padding:
    6px 8px 2px;

}


/* ==================================================
   16｜訊息提示
================================================== */

.toast {

  position: fixed;

  left: 50%;

  bottom: 32px;

  transform:
    translateX(-50%);

  background:
    rgba(
      0,
      0,
      0,
      .9
    );

  color:
    white;

  padding:
    11px 18px;

  border-radius: 22px;

  display: none;

  z-index: 9999;

  font-size: 14px;

}


/* ==================================================
   17｜手機
================================================== */

@media
(max-width: 700px) {

  .topbar {

    padding:
      0 8px;

  }

  .top-button {

    padding:
      9px 8px;

    font-size:
      12px;

  }

  .editor-title {

    min-height:
      75px;

  }

  .timeline-area {

    height:
      310px;

  }

  .material-button {

    min-width:
      96px;

    padding:
      11px 8px;

  }

  .tool-button {

    min-width:
      91px;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     01｜最上方
================================================== -->

<header class="topbar">


  <div class="top-left">


    <button
      class="top-button"
      onclick="goBackToLibrary()"
    >

      ← 回音樂素材

    </button>


  </div>


  <div class="top-right">


    <button
      class="top-button"
      onclick="openUpload()"
    >

      ⬆️ 上傳音樂

    </button>


    <button
      class="top-button finish-button"
      onclick="finishProject()"
    >

      ✅ 完成

    </button>


  </div>


</header>


<!-- 真正的上傳按鈕藏起來 -->

<input
  id="uploadInput"
  type="file"
  accept="audio/*"
  multiple
  hidden
>


<!-- ==================================================
     02｜剪輯器標題
================================================== -->

<section class="editor-title">


  <div>


    <div class="editor-title-icon">

      🎧

    </div>


    <div class="editor-title-main">

      自由品勢音樂剪輯

    </div>


    <div class="editor-title-small">

      加入素材後才會自動產生剪輯軌道

    </div>


  </div>


</section>


<!-- ==================================================
     03｜時間軸
================================================== -->

<section class="timeline-area">


  <!-- 時間刻度 -->

  <div class="ruler">

    <span>00:00</span>

    <span>00:10</span>

    <span>00:20</span>

    <span>00:30</span>

    <span>00:40</span>

    <span>00:50</span>

    <span>01:00</span>

    <span>01:10</span>

    <span>01:20</span>

    <span>01:30</span>

  </div>


  <!-- 中央播放線 -->

  <div class="playhead"></div>


  <!-- 時間軸內容 -->

  <div class="timeline-scroll">


    <div
      id="trackContainer"
      class="track-container"
    >


      <div
        id="emptyTimeline"
        class="empty-timeline"
      >

        還沒有素材<br>

        點「音樂、拼接、音效」或「上傳音樂」開始剪輯

      </div>


    </div>


  </div>


</section>


<!-- ==================================================
     04｜唯一一組素材入口
================================================== -->

<section class="material-bar">


  <button
    class="material-button"
    onclick="openMaterial('music')"
  >

    🎵 音樂

  </button>


  <button
    class="material-button"
    onclick="openMaterial('splice')"
  >

    ✂️ 拼接

  </button>


  <button
    class="material-button"
    onclick="openMaterial('effect')"
  >

    🔊 音效

  </button>


</section>


<!-- ==================================================
     05｜提示
================================================== -->

<div
  id="selectTip"
  class="select-tip"
>

  請先點選時間軸上的一段素材

</div>


<!-- ==================================================
     06｜所有工具放下面
================================================== -->

<section class="tool-area">


  <div class="tool-row">


    <!-- 播放 -->


    <button
      class="tool-button"
      onclick="playProject()"
    >

      <span class="tool-icon">

        ▶

      </span>

      <span class="tool-name">

        播放

      </span>

      <span class="tool-desc">

        播放剪輯內容

      </span>

    </button>


    <!-- 回上一步 -->


    <button
      class="tool-button"
      onclick="undoAction()"
    >

      <span class="tool-icon">

        ↶

      </span>

      <span class="tool-name">

        回上一步

      </span>

      <span class="tool-desc">

        回到前一個動作

      </span>

    </button>


    <!-- 重做 -->


    <button
      class="tool-button"
      onclick="redoAction()"
    >

      <span class="tool-icon">

        ↷

      </span>

      <span class="tool-name">

        重做

      </span>

      <span class="tool-desc">

        回復剛才動作

      </span>

    </button>


    <!-- 節拍 -->


    <button
      class="tool-button"
      onclick="beatAction()"
    >

      <span class="tool-icon">

        🚩

      </span>

      <span class="tool-name">

        節拍

      </span>

      <span class="tool-desc">

        標記動作卡點

      </span>

    </button>


    <!-- 分割 -->


    <button
      class="tool-button need-clip"
      onclick="splitAction()"
      disabled
    >

      <span class="tool-icon">

        ✂️

      </span>

      <span class="tool-name">

        分割

      </span>

      <span class="tool-desc">

        從播放線切開

      </span>

    </button>


    <!-- 刪除 -->


    <button
      class="tool-button need-clip"
      onclick="deleteAction()"
      disabled
    >

      <span class="tool-icon">

        🗑️

      </span>

      <span class="tool-name">

        刪除

      </span>

      <span class="tool-desc">

        移除選取片段

      </span>

    </button>


    <!-- 音量 -->


    <button
      class="tool-button need-clip"
      onclick="volumeAction()"
      disabled
    >

      <span class="tool-icon">

        🔊

      </span>

      <span class="tool-name">

        音量

      </span>

      <span class="tool-desc">

        調大或調小

      </span>

    </button>


    <!-- 淡入淡出 -->


    <button
      class="tool-button need-clip"
      onclick="fadeAction()"
      disabled
    >

      <span class="tool-icon">

        ◐

      </span>

      <span class="tool-name">

        淡入淡出

      </span>

      <span class="tool-desc">

        慢慢進慢慢退

      </span>

    </button>


    <!-- 複製 -->


    <button
      class="tool-button need-clip"
      onclick="copyAction()"
      disabled
    >

      <span class="tool-icon">

        ⧉

      </span>

      <span class="tool-name">

        複製

      </span>

      <span class="tool-desc">

        複製這一段

      </span>

    </button>


    <!-- 變速 -->


    <button
      class="tool-button need-clip"
      onclick="speedAction()"
      disabled
    >

      <span class="tool-icon">

        ⏱️

      </span>

      <span class="tool-name">

        變速

      </span>

      <span class="tool-desc">

        加快或放慢

      </span>

    </button>


    <!-- 靜音 -->


    <button
      class="tool-button need-clip"
      onclick="muteAction()"
      disabled
    >

      <span class="tool-icon">

        🔇

      </span>

      <span class="tool-name">

        靜音

      </span>

      <span class="tool-desc">

        這一段不出聲

      </span>

    </button>


  </div>


</section>


<!-- ==================================================
     07｜提示框
================================================== -->

<div
  id="toast"
  class="toast"
></div>


<script>

/* ==================================================
   01｜剪輯資料
================================================== */

let clips = [];

let selectedClipId = null;


/* ==================================================
   02｜回音樂素材
================================================== */

function goBackToLibrary() {

  window.location.href =
    "https://13579jo.github.io/taekwondo-music-library/";

}


/* ==================================================
   03｜開啟手機／電腦音樂
================================================== */

function openUpload() {

  document
    .getElementById(
      "uploadInput"
    )
    .click();

}


/* ==================================================
   04｜接收上傳音訊
================================================== */

document
  .getElementById(
    "uploadInput"
  )
  .addEventListener(
    "change",
    function(event) {


      const files =
        Array.from(
          event.target.files
        );


      files.forEach(
        function(file) {


          const audioUrl =
            URL.createObjectURL(
              file
            );


          addClip({

            id:
              "clip_" +
              Date.now() +
              "_" +
              Math.random(),

            name:
              file.name,

            type:
              "music",

            audioUrl:
              audioUrl,

            left:
              60,

            width:
              260

          });


        }
      );


      event.target.value =
        "";


    }
  );


/* ==================================================
   05｜加入片段
================================================== */

function addClip(data) {

  clips.push(data);

  renderTimeline();

  showToast(
    "✅ 已加入剪輯軌道"
  );

}


/* ==================================================
   06｜顯示時間軸
================================================== */

function renderTimeline() {


  const container =
    document.getElementById(
      "trackContainer"
    );


  container.innerHTML =
    "";


  if (
    clips.length === 0
  ) {


    container.innerHTML = `

      <div class="empty-timeline">

        還沒有素材<br>

        點「音樂、拼接、音效」
        或「上傳音樂」開始剪輯

      </div>

    `;


    selectedClipId =
      null;


    updateToolState();


    return;


  }


  /*
  現階段：
  一個素材自動產生一行

  下一步：
  改成可以上下自由拖，
  軌道會自動增加／收起。
  */


  clips.forEach(
    function(clip, index) {


      const track =
        document.createElement(
          "div"
        );


      track.className =
        "track";


      const clipBox =
        document.createElement(
          "div"
        );


      clipBox.className =
        "clip " +
        clip.type;


      if (
        clip.id ===
        selectedClipId
      ) {


        clipBox.classList.add(
          "selected"
        );


      }


      clipBox.style.left =
        clip.left +
        "px";


      clipBox.style.width =
        clip.width +
        "px";


      clipBox.innerHTML = `

        <div class="clip-name">

          ${clip.name}

        </div>

        <div class="fake-wave"></div>

      `;


      clipBox.onclick =
        function() {


          selectedClipId =
            clip.id;


          renderTimeline();


        };


      track.appendChild(
        clipBox
      );


      container.appendChild(
        track
      );


    }
  );


  updateToolState();

}


/* ==================================================
   07｜選取片段後開啟工具
================================================== */

function updateToolState() {


  const hasSelection =
    selectedClipId !== null;


  document
    .querySelectorAll(
      ".need-clip"
    )
    .forEach(
      function(button) {


        button.disabled =
          !hasSelection;


      }
    );


  const selected =
    clips.find(
      function(clip) {


        return (
          clip.id ===
          selectedClipId
        );


      }
    );


  document
    .getElementById(
      "selectTip"
    )
    .textContent =

      selected

      ? "目前選擇：" +
        selected.name

      : "請先點選時間軸上的一段素材";

}


/* ==================================================
   08｜素材入口
   下一步才接正式素材庫
================================================== */

function openMaterial(type) {


  if (
    type === "music"
  ) {


    showToast(
      "🎵 下一步接音樂素材"
    );


  }


  if (
    type === "splice"
  ) {


    showToast(
      "✂️ 下一步接拼接素材"
    );


  }


  if (
    type === "effect"
  ) {


    showToast(
      "🔊 下一步接音效素材"
    );


  }


}


/* ==================================================
   09｜播放
================================================== */

function playProject() {

  showToast(
    "▶ 下一步接真正播放"
  );

}


/* ==================================================
   10｜回上一步
================================================== */

function undoAction() {

  showToast(
    "↶ 下一步接回上一步"
  );

}


/* ==================================================
   11｜重做
================================================== */

function redoAction() {

  showToast(
    "↷ 下一步接重做"
  );

}


/* ==================================================
   12｜節拍
================================================== */

function beatAction() {

  showToast(
    "🚩 下一步接節拍"
  );

}


/* ==================================================
   13｜分割
================================================== */

function splitAction() {

  showToast(
    "✂️ 下一步接真正分割"
  );

}


/* ==================================================
   14｜刪除
================================================== */

function deleteAction() {


  if (
    !selectedClipId
  ) {

    return;

  }


  clips =
    clips.filter(
      function(clip) {


        return (
          clip.id !==
          selectedClipId
        );


      }
    );


  selectedClipId =
    null;


  renderTimeline();


  showToast(
    "🗑️ 已刪除片段"
  );

}


/* ==================================================
   15｜音量
================================================== */

function volumeAction() {

  showToast(
    "🔊 下一步接音量調整"
  );

}


/* ==================================================
   16｜淡入淡出
================================================== */

function fadeAction() {

  showToast(
    "◐ 下一步接淡入淡出"
  );

}


/* ==================================================

/* ==================================================
   21｜訊息提示
================================================== */

let toastTimer;


function showToast(text) {


  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.style.display =
    "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {


        toast.style.display =
          "none";


      },

      1700
    );

}
